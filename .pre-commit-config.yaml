# The fuzz corpus holds exact input bytes, which the whitespace and line ending fixers must not change.
exclude: ^(.idea|.vscode|cpp/tests/fuzz/corpus)

# Run with prek (https://prek.j178.dev), a fast drop-in replacement for pre-commit.
# Hooks with the same priority run concurrently, lower priority values run first.
repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
        priority: 1
      - id: check-case-conflict
        priority: 1
      - id: check-json
        priority: 1
      - id: check-merge-conflict
        priority: 1
      - id: check-toml
        priority: 1
      - id: end-of-file-fixer
        priority: 1
      - id: mixed-line-ending
        priority: 1
      - id: trailing-whitespace
        priority: 1

  - repo: local
    hooks:
      - id: clang-format
        name: C++ Clang-format
        description: Run clang-format on files included in the commit.
        entry: clang-format -i --style=file
        types_or: [c, c++]
        language: system
        files: ^(cpp/(src|tests)|test-plugin/src)/
        priority: 1

      - id: cmake-format
        name: CMake Format
        description: Run cmake-format on CMake files included in the commit.
        entry: cmake-format -i
        language: system
        files: ^(cpp|test-plugin)/(.+/)?(CMakeLists\.txt|[^/]+\.cmake)$
        priority: 1

      - id: cargo-fmt
        name: Rust Format
        description: Run rustfmt on Rust files included in the commit, with the Rust workspace settings.
        entry: bash -c 'cd rust && cargo fmt --'
        types: [rust]
        language: system
        files: ^rust/
        pass_filenames: false
        priority: 1

      - id: ruff-format
        name: Python Format
        description: Run ruff format on Python files included in the commit, with the pyproject.toml settings.
        entry: uv run --frozen ruff format --force-exclude
        types: [python]
        language: system
        priority: 1

      # After ruff format, because both rewrite the same Python files.
      - id: ruff-check
        name: Python Lint
        description: Run ruff check with fixes on Python files included in the commit.
        entry: uv run --frozen ruff check --fix --force-exclude
        types: [python]
        language: system
        priority: 2
