[package]
name = "image-control-plugin-rs"
version = "1.0.0"
workspace = "../../../.."
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["editor", "vst3", "clap"]
clap = ["dep:clack-plugin", "dep:clack-extensions", "dep:crossbeam-queue"]
editor = ["dep:iced_baseview", "dep:iced_program", "dep:iced_widget", "dep:baseview", "dep:fragile"]
vst3 = []

[dependencies]
arc-swap.workspace = true
atomic_refcell.workspace = true
baseview = { version = "0.4.2", optional = true }
clack-plugin = { version = "=0.2.0", optional = true }
clack-extensions = { version = "=0.2.0", optional = true, features = ["clack-plugin", "audio-ports", "configurable-audio-ports", "gui", "latency", "params", "render", "state", "tail"] }
crossbeam-queue = { workspace = true, optional = true }
fragile = { version = "3.0.0", optional = true }
iced_baseview = { version = "0.6.0", optional = true, default-features = false, features = ["app-builder", "wgpu", "advanced", "thread-pool", "fira-sans", "tracing"] }
iced_program = { version = "0.14.0", optional = true }
iced_widget = { version = "0.14.2", optional = true, default-features = false, features = ["wgpu"] }
image-control-dsp = { path = "../dsp" }
dirs.workspace = true
tempfile.workspace = true
raw-window-handle.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde.workspace = true
sync_wrapper.workspace = true
thiserror.workspace = true
vst3.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
anyhow.workspace = true
clack-host = { version = "=0.2.0", features = ["clack-plugin"] }
clack-extensions = { version = "=0.2.0", features = ["clack-host"] }
libloading.workspace = true
tempfile.workspace = true
vst3-host = { workspace = true, features = ["editor"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
objc2.workspace = true

[lints]
workspace = true
