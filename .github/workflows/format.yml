name: Format

on:
  push:
    branches:
      - main
  pull_request:

# Only the newest revision of a branch needs runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Formatting and independent fixtures
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # One runner owns formatting and independent expectations, without competing checkouts or setup.
      - name: Install formatters and fixture tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install clang-format shfmt jq uv

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: |
          clang-format --version
          ./format.sh --check

      # Regeneration stays inside this disposable checkout, never a developer's fixture tree.
      - name: Regenerate the expected plugin outputs
        if: ${{ !cancelled() }}
        run: |
          rm -rf fixtures/plugin_expected
          uv run fixtures/plugin_expected.py

      - name: Check plugin output differences
        if: ${{ !cancelled() }}
        run: |
          git status --porcelain fixtures/plugin_expected
          test -z "$(git status --porcelain fixtures/plugin_expected)"

      - name: Check independent spectrogram fixtures
        if: ${{ !cancelled() }}
        run: uv run --script fixtures/spectrogram_expected.py --check

      - name: Check independent source metrics
        if: ${{ !cancelled() }}
        run: uv run --script fixtures/metrics_expected.py --check
