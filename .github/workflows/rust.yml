name: Rust

on:
  push:
    branches:
      - main
    paths:
      - ".gitattributes"
      - ".github/workflows/rust.yml"
      - "assets/**"
      - "common.sh"
      - "cpp/JUCE"
      - "fixtures/**"
      - "!fixtures/normalization/**"
      - "rust/**"
      - "test-plugin/**"
      - "!**/*.md"
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/rust.yml"
      - "assets/**"
      - "common.sh"
      - "cpp/JUCE"
      - "fixtures/**"
      - "!fixtures/normalization/**"
      - "rust/**"
      - "test-plugin/**"
      - "!**/*.md"

# Cancel previous runs for PRs but not pushes to main
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: "1"
  # Override target-cpu=native from rust/.cargo/config.toml to avoid illegal instruction
  # errors on GitHub Actions runners with varying CPU capabilities
  RUSTFLAGS: ""

defaults:
  run:
    shell: bash
    working-directory: rust

jobs:
  build:
    # The Windows image is the one the C++ workflow uses,
    # since the test plugin needs CMake 4.2 and the Visual Studio generator that comes with it.
    strategy:
      matrix:
        os: [macos-latest, windows-2025-vs2026]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      # The Rust port does not use JUCE, but the test VST3 in test-plugin/ is built with it.
      # The JUCE submodule is the only one, and checkout fetches it at depth 1.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Get JUCE commit
        id: juce
        run: echo "commit=$(git rev-parse HEAD:cpp/JUCE)" >> "$GITHUB_OUTPUT"

      - name: Cache test plugin build
        uses: actions/cache@v6
        with:
          path: test-plugin/build
          key: ${{ runner.os }}-test-plugin-${{ steps.juce.outputs.commit }}-${{ hashFiles('test-plugin/CMakeLists.txt', 'test-plugin/src/**') }}
          restore-keys: ${{ runner.os }}-test-plugin-${{ steps.juce.outputs.commit }}-

      # The tests find the bundle in test-plugin/build, and fail instead of skipping when CI is set and it is missing.
      - name: Build test plugin
        run: ../test-plugin/build.sh

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Check shared input identities
        run: |
          cargo test -p test-fixtures test_identity --lib -- --show-output
          cargo test -p audiobatch-core generated_inputs_have_shared_identities --lib -- --show-output
          cargo test --release -p audiobatch-core generated_inputs_have_shared_identities --lib -- --show-output

      - name: Capture debug numerical stages
        env:
          AUDIOBATCH_DIAGNOSTICS_DIR: target/numerical-diagnostics/debug
        run: cargo test -p audiobatch-core numerical_diagnostics_ --lib -- --ignored

      - name: Capture optimized numerical stages
        env:
          AUDIOBATCH_DIAGNOSTICS_DIR: target/numerical-diagnostics/release
        run: cargo test --release -p audiobatch-core numerical_diagnostics_ --lib -- --ignored

      - name: Save numerical diagnostic provenance
        if: always()
        run: |
          mkdir -p target/numerical-diagnostics
          git rev-parse HEAD > target/numerical-diagnostics/revision.txt
          cp Cargo.lock target/numerical-diagnostics/Cargo.lock
          sha256sum Cargo.lock > target/numerical-diagnostics/Cargo.lock.sha256
          cp crates/core/tests/golden/input/signals.txt target/numerical-diagnostics/input-signals.txt
          cp ../fixtures/checksums.sha256 target/numerical-diagnostics/fixture-checksums.sha256

      - name: Upload numerical diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: numerical-diagnostics-${{ matrix.os }}
          path: rust/target/numerical-diagnostics
          if-no-files-found: error

      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast --success-output final

      - name: Set up uv for packaging tests
        if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@v10.3.2

      - name: Check distribution license notices
        if: runner.os == 'macOS'
        run: uv run --script scripts/test_distribution_licenses.py

      # Optimized SIMD kernels must preserve the exact golden output on both hardware backends.
      - name: Log release test hardware and compiler
        run: |
          rustc --version --verbose
          rustc --print cfg
          echo "Portable RUSTFLAGS: '$RUSTFLAGS'"
          echo "Runner: $RUNNER_OS $RUNNER_ARCH"
          case "$RUNNER_ARCH" in
            ARM64) echo "True peak backend: NEON" ;;
            X64) echo "True peak backend: AVX2 (runtime checked)" ;;
          esac
          if [ "$RUNNER_OS" = "macOS" ]; then
            sysctl -n machdep.cpu.brand_string
            sysctl -n hw.optional.neon || true
          else
            powershell.exe -NoProfile -Command 'Get-CimInstance Win32_Processor | Select-Object Name, Architecture, NumberOfCores | Format-List'
          fi

      - name: Run optimized core tests
        run: cargo nextest run --release -p audiobatch-core --no-fail-fast

      # Runs the CLI on the committed fixtures and checks the reported level and the exit codes,
      # like the CLI smoke test of the C++ build.
      - name: CLI smoke test
        run: |
          cargo run --quiet --bin audiobatch-rs -- --help
          cargo run --quiet --bin audiobatch-rs -- ../fixtures/sine_stereo_44100_16.wav | tee smoke-output.txt
          grep -- "-6.02" smoke-output.txt
          set +e
          cargo run --quiet --bin audiobatch-rs -- ../fixtures/broken.wav
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 2 ]; then
            echo "Expected exit code 2 for a broken file, got $EXIT_CODE"
            exit 1
          fi

  lint:
    # Clippy runs on both platforms, since the VST3 host, the editor windows, and the GUI have platform code.
    strategy:
      matrix:
        os: [macos-latest, windows-2025-vs2026]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        if: runner.os == 'macOS'
        run: cargo fmt --all --check

      # Exit non-zero if there are any warnings
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The snapshot feature renders the GUI to a PNG for checking layouts, and is off in normal builds.
      - name: Build GUI with the snapshot feature
        if: runner.os == 'macOS'
        run: cargo build -p audiobatch-gui --features snapshot

  coverage:
    runs-on: macos-latest
    steps:
      # Checks out JUCE and builds the test VST3 like the build job.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Get JUCE commit
        id: juce
        run: echo "commit=$(git rev-parse HEAD:cpp/JUCE)" >> "$GITHUB_OUTPUT"

      - name: Cache test plugin build
        uses: actions/cache@v6
        with:
          path: test-plugin/build
          key: ${{ runner.os }}-test-plugin-${{ steps.juce.outputs.commit }}-${{ hashFiles('test-plugin/CMakeLists.txt', 'test-plugin/src/**') }}
          restore-keys: ${{ runner.os }}-test-plugin-${{ steps.juce.outputs.commit }}-

      # The tests find the bundle in test-plugin/build, and fail instead of skipping when CI is set and it is missing.
      - name: Build test plugin
        run: ../test-plugin/build.sh

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov and nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run tests with coverage
        run: cargo llvm-cov nextest --workspace --no-fail-fast --no-report

      - name: Write coverage reports
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov report --lcov --output-path target/llvm-cov/lcov.info
          cargo llvm-cov report --html
          {
            echo '## Rust code coverage'
            echo '```text'
            cargo llvm-cov report --summary-only
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: |
            rust/target/llvm-cov/lcov.info
            rust/target/llvm-cov/html
          if-no-files-found: error
