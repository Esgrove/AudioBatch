name: Rust

on:
  push:
    branches:
      - main
    paths:
      - ".gitattributes"
      - ".github/workflows/rust.yml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rustfmt.toml"
      - "image-control-plugin/rust/**"
      - "assets/**"
      - "common.sh"
      - "cpp/JUCE"
      - "cpp/cmake/MacSigning.cmake"
      - "cpp/tests/fuzz/corpus/**"
      - "fixtures/**"
      - "rust/**"
      - "test-plugin/**"
      - "tests/**"
      - "!**/*.md"
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/rust.yml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rustfmt.toml"
      - "image-control-plugin/rust/**"
      - "assets/**"
      - "common.sh"
      - "cpp/JUCE"
      - "cpp/cmake/MacSigning.cmake"
      - "cpp/tests/fuzz/corpus/**"
      - "fixtures/**"
      - "rust/**"
      - "test-plugin/**"
      - "tests/**"
      - "!**/*.md"

# Superseded runs on the same branch or PR release their runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: "1"
  # Override target-cpu=native from .cargo/config.toml.
  # Runners have varying CPU capabilities, so native builds can cause illegal instruction errors.
  RUSTFLAGS: ""

defaults:
  run:
    shell: bash
    working-directory: rust

jobs:
  build:
    # The Windows image is the one the C++ workflow uses,
    # since the test plugin needs CMake 4.2 and the Visual Studio generator that comes with it.
    strategy:
      matrix:
        os: [macos-latest, windows-2025-vs2026]
      max-parallel: 1
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      # Installing nightly must not change the toolchain of application checks or coverage.
      RUSTUP_TOOLCHAIN: stable
      AUDIOBATCH_RTSAN_TOOLCHAIN: nightly
      AUDIOBATCH_REQUIRE_NORMALIZATION_FIXTURES: ${{ startsWith(matrix.os, 'windows-') && '1' || '0' }}
    steps:
      # The Rust port does not use JUCE, but the test VST3 in test-plugin/ is built with it.
      # The JUCE submodule is the only one, and checkout fetches it at depth 1.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: List LFS objects
        if: runner.os == 'Windows'
        working-directory: .
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects

      - name: Restore LFS objects
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}

      - name: Pull LFS files
        if: runner.os == 'Windows'
        working-directory: .
        run: git lfs pull

      - name: Get JUCE commit
        id: juce
        run: echo "commit=$(git rev-parse HEAD:cpp/JUCE)" >> "$GITHUB_OUTPUT"

      - name: Restore test plugin build
        id: test-plugin-cache
        uses: actions/cache/restore@v6
        with:
          path: test-plugin/cmake-build-release
          key: ${{ runner.os }}-test-plugin-${{ steps.juce.outputs.commit }}-${{ hashFiles('test-plugin/CMakeLists.txt', 'test-plugin/src/**') }}
          restore-keys: ${{ runner.os }}-test-plugin-${{ steps.juce.outputs.commit }}-

      - name: Set up stable Rust toolchain
        if: ${{ !cancelled() }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt,llvm-tools-preview

      - name: Install Rust CI tools
        id: ci-tools
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@v2
        with:
          tool: ${{ runner.os == 'macOS' && 'nextest,cargo-llvm-cov,cargo-fuzz' || 'nextest' }}

      # Resolve the ordinary dependency cache before installing nightly, so daily audit updates do not evict it.
      - name: Cache Rust dependencies
        if: ${{ !cancelled() }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> rust/target"
          # Keep caches warm even when strict Miri reports its known dependency blocker.
          cache-on-failure: true
          # Tools are installed once above, never restored over those selected versions.
          cache-bin: false

      - name: Set up nightly Rust with Miri
        id: nightly
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri,rust-src

      - name: Set up uv
        if: ${{ !cancelled() }}
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install Homebrew LLVM and native build tools
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: |
          mkdir -p target/rtsan/artifacts
          brew install llvm ninja jq ripgrep 2>&1 | tee target/rtsan/artifacts/dependencies.log

      # Keep the resolved nightly identity even if its LLVM does not match Homebrew's runtime.
      # rtsan.sh must fail on an LLVM major.minor mismatch or an unusable startup runtime, never skip the check.
      - name: Record native sanitizer toolchain
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: |
          mkdir -p target/rtsan/artifacts
          {
            uname -sm
            rustup show active-toolchain
            rustc +nightly --version --verbose
            cargo +nightly --version
            "$(brew --prefix llvm)/bin/clang" --version
            cmake --version
            ninja --version
            uv --version
          } 2>&1 | tee target/rtsan/artifacts/toolchain.log

      # Tests, coverage, and RTSan share this build-tree bundle, never an installed plugin or physical audio device.
      # Preserve its build log alongside RTSan's dependency and toolchain evidence.
      - name: Build test plugin
        id: test-plugin-build
        if: ${{ !cancelled() }}
        working-directory: test-plugin
        run: |
          mkdir -p "$GITHUB_WORKSPACE/rust/target/rtsan/artifacts"
          ./build.sh 2>&1 | tee "$GITHUB_WORKSPACE/rust/target/rtsan/artifacts/native-plugin-build.log"

      - name: Save test plugin build before independent audits
        if: ${{ !cancelled() && steps.test-plugin-build.outcome == 'success' && steps.test-plugin-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: test-plugin/cmake-build-release
          key: ${{ steps.test-plugin-cache.outputs.cache-primary-key }}

      - name: Check formatting
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: ./format.sh --check

      - name: Lint
        if: ${{ !cancelled() }}
        run: ./lint.sh --check --application-only

      # The fuzz crate is its own workspace, and its targets build on stable outside cargo-fuzz.
      - name: Lint fuzz targets
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

      # The snapshot feature is off in normal builds, so it needs its own compile check.
      - name: Build GUI with the snapshot feature
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: cargo build -p audiobatch-gui --features snapshot

      # Includes shared fixture checksums, generated input identities, and exact platform goldens.
      # Nextest builds the test targets, avoiding a separate all-targets build.
      - name: Run unit and service tests
        if: ${{ !cancelled() }}
        run: ./test.sh --unit

      - name: Driven GUI integration workflows
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: ./test.sh --gui-integration

      # Each backend must preserve its platform baseline in optimized builds too.
      - name: Run optimized core and Windows CLI tests
        if: ${{ !cancelled() }}
        run: ./test.sh --optimized

      - name: CLI integration contracts
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: ./test.sh --cli-integration

      - name: Upload integration failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rust-integration-${{ runner.os }}
          path: rust/target/integration-artifacts
          if-no-files-found: ignore

      # Required phases run independently of earlier failures, including known strict Miri blockers.
      # Miri checks the unsafe VST3/CLAP hosts, shared host core, test plugins, parsers, and cache blob readers.
      - name: Run tests under Miri
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 30
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/audiobatch-miri-target
        run: ./miri.sh

      - name: Release Miri build storage
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: rm -rf "$RUNNER_TEMP/audiobatch-miri-target"

      # Keep nightly explicit, matching the fuzz harness toolchain rather than the stable job default.
      - name: Check exact decoder panic regressions with overflow checks
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: cargo +nightly test --manifest-path fuzz/Cargo.toml --target-dir fuzz/target --test decoder_regressions

      - name: Build fuzz targets
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: ./fuzz.sh --build-only

      - name: Replay every corpus including decoder regressions
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: ./fuzz.sh --no-build --replay

      # New inputs go to a scratch corpus, so the committed corpus stays as it is.
      - name: Fuzz Serato, CLI arguments, and cache blobs (required)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: ./fuzz.sh --no-build --fuzz --targets parsers --seconds 60

      - name: Upload crashing inputs
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-fuzz-artifacts
          path: rust/fuzz/artifacts
          if-no-files-found: ignore

      # First-party audio data callbacks must pass strictly, independently of native/error-ownership audits.
      - name: Require clean first-party audio callbacks
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: ./rtsan.sh --skip-native --artifacts target/rtsan/artifacts/first-party 2>&1 | tee target/rtsan/artifacts/first-party.log

      # --diagnostic verifies specific native dependency reports as BLOCKED, never clean callback passes.
      - name: Check callbacks and verify known blockers
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: ./rtsan.sh --diagnostic 2>&1 | tee target/rtsan/artifacts/run.log

      - name: Upload realtime sanitizer diagnostics
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-realtime-sanitizer
          path: rust/target/rtsan/artifacts
          if-no-files-found: error

      - name: Release realtime sanitizer build storage after uploading evidence
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: rm -rf target/rtsan

      # Coverage invokes nextest directly, so build its test-only CLAP module explicitly.
      - name: Build CLAP test module
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: CARGO_TARGET_DIR=target/llvm-cov-target cargo build -p audiobatch-test-clap-plugin --example clap_module

      - name: Run tests and CLI subprocesses with coverage
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 30
        run: ./coverage.sh --lcov

      - name: Write coverage reports
        if: ${{ always() && runner.os == 'macOS' }}
        run: ./coverage.sh --report-only

      - name: Upload coverage reports
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: |
            rust/target/llvm-cov/lcov.info
            rust/target/llvm-cov/html
            rust/target/integration-artifacts
          if-no-files-found: error

      - name: Release instrumented coverage build storage
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: rm -rf target/llvm-cov-target

      # Known Symphonia arithmetic defects remain visible without making any required check optional.
      - name: Build decoder diagnostic target
        id: decoder-build
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        continue-on-error: true
        timeout-minutes: 30
        run: |
          mkdir -p fuzz/artifacts
          ./fuzz.sh --build-only --targets decoder 2>&1 | tee fuzz/artifacts/decoder-build.log

      # Bash pipefail preserves the fuzzer's real outcome through tee, even with step-level diagnostics.
      - name: Mutate decoder inputs (diagnostic, failures remain visible)
        id: decoder-mutations
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.decoder-build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p fuzz/artifacts
          ./fuzz.sh --no-build --fuzz --targets decoder --seconds 60 2>&1 | tee fuzz/artifacts/decoder-mutations.log

      - name: Report decoder diagnostic outcome
        if: ${{ always() && runner.os == 'macOS' }}
        env:
          NIGHTLY_OUTCOME: ${{ steps.nightly.outcome }}
          TOOLS_OUTCOME: ${{ steps.ci-tools.outcome }}
          BUILD_OUTCOME: ${{ steps.decoder-build.outcome }}
          MUTATION_OUTCOME: ${{ steps.decoder-mutations.outcome }}
        run: |
          mkdir -p fuzz/artifacts
          {
            printf '## Decoder mutation fuzz, non-blocking diagnostics\n\n'
            printf 'Nightly setup: %s. CI tool setup: %s. Decoder build: %s. Mutation campaign: %s.\n\n' \
              "$NIGHTLY_OUTCOME" "$TOOLS_OUTCOME" "$BUILD_OUTCOME" "$MUTATION_OUTCOME"
            printf 'Known Symphonia 0.6.1 WAV arithmetic defects remain unfixed.\n'
            printf 'A failed or incomplete campaign is not a clean fuzz result. See the step outcomes and diagnostic artifacts.\n'
            printf 'Checked decoder regressions, every corpus replay, parser/cache mutations, and Miri remain required.\n'
          } | tee fuzz/artifacts/decoder-diagnostic-outcome.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$NIGHTLY_OUTCOME" != success ] || [ "$TOOLS_OUTCOME" != success ] || \
             [ "$BUILD_OUTCOME" != success ] || [ "$MUTATION_OUTCOME" != success ]; then
            printf '::warning::Decoder diagnostics failed or did not complete. Review logs and artifacts, not a clean fuzz result.\n'
          fi

      - name: Upload decoder diagnostic logs and crashing inputs
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-decoder-fuzz-diagnostics
          path: rust/fuzz/artifacts
          if-no-files-found: warn
