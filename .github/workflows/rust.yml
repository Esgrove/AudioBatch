name: Rust

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rust.yml"
      - "assets/Roboto*.ttf"
      - "fixtures/**"
      - "rust/**"
      - "!**/*.md"
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - "assets/Roboto*.ttf"
      - "fixtures/**"
      - "rust/**"
      - "!**/*.md"

# Cancel previous runs for PRs but not pushes to main
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash
    working-directory: rust

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      # The Rust port does not use JUCE, so the submodule is not checked out.
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast

      # Runs the CLI on the committed fixtures and checks the reported level and the exit codes,
      # like the CLI smoke test of the C++ build.
      - name: CLI smoke test
        run: |
          cargo run --quiet --bin audiobatch-rs -- --help
          cargo run --quiet --bin audiobatch-rs -- ../fixtures/sine_stereo_44100_16.wav | tee smoke-output.txt
          grep -- "-6.02" smoke-output.txt
          set +e
          cargo run --quiet --bin audiobatch-rs -- ../fixtures/broken.wav
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 2 ]; then
            echo "Expected exit code 2 for a broken file, got $EXIT_CODE"
            exit 1
          fi

  lint:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --all --check

      # Exit non-zero if there are any warnings
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
