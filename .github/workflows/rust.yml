name: Rust

on:
  push:
    branches:
      - main
    paths:
      - ".gitattributes"
      - ".github/workflows/rust.yml"
      - "assets/**"
      - "common.sh"
      - "cpp/JUCE"
      - "fixtures/**"
      - "rust/**"
      - "test-plugin/**"
      - "!**/*.md"
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/rust.yml"
      - "assets/**"
      - "common.sh"
      - "cpp/JUCE"
      - "fixtures/**"
      - "rust/**"
      - "test-plugin/**"
      - "!**/*.md"

# Cancel previous runs for PRs but not pushes to main
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: "1"
  # Override target-cpu=native from rust/.cargo/config.toml to avoid illegal instruction
  # errors on GitHub Actions runners with varying CPU capabilities
  RUSTFLAGS: ""

defaults:
  run:
    shell: bash
    working-directory: rust

jobs:
  build:
    # The Windows image is the one the C++ workflow uses,
    # since the test plugin needs CMake 4.2 and the Visual Studio generator that comes with it.
    strategy:
      matrix:
        os: [macos-latest, windows-2025-vs2026]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      AUDIOBATCH_REQUIRE_NORMALIZATION_FIXTURES: ${{ startsWith(matrix.os, 'windows-') && '1' || '0' }}
    steps:
      # The Rust port does not use JUCE, but the test VST3 in test-plugin/ is built with it.
      # The JUCE submodule is the only one, and checkout fetches it at depth 1.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: List LFS objects
        if: runner.os == 'Windows'
        working-directory: .
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects

      - name: Restore LFS objects
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}

      - name: Pull LFS files
        if: runner.os == 'Windows'
        working-directory: .
        run: git lfs pull

      - name: Get JUCE commit
        id: juce
        run: echo "commit=$(git rev-parse HEAD:cpp/JUCE)" >> "$GITHUB_OUTPUT"

      - name: Cache test plugin build
        uses: actions/cache@v6
        with:
          path: test-plugin/build
          key: ${{ runner.os }}-test-plugin-${{ steps.juce.outputs.commit }}-${{ hashFiles('test-plugin/CMakeLists.txt', 'test-plugin/src/**') }}
          restore-keys: ${{ runner.os }}-test-plugin-${{ steps.juce.outputs.commit }}-

      # The tests find the bundle in test-plugin/build, and fail instead of skipping when CI is set and it is missing.
      - name: Build test plugin
        run: ../test-plugin/build.sh

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Test parity oracles and benchmark tooling natively
        if: runner.os == 'Windows'
        run: |
          uv run --script scripts/test_parity.py
          uv run --script scripts/test_cli_benchmark.py

      - name: Check formatting
        if: runner.os == 'macOS'
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The snapshot feature is off in normal builds, so it needs its own compile check.
      - name: Build GUI with the snapshot feature
        if: runner.os == 'macOS'
        run: cargo build -p audiobatch-gui --features snapshot

      # Includes shared fixture checksums, generated input identities, and exact platform goldens.
      # Nextest builds the test targets, avoiding a separate all-targets build.
      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast --success-output final

      - name: Check distribution license notices
        if: runner.os == 'macOS'
        run: uv run --script scripts/test_distribution_licenses.py

      # Each backend must preserve its platform baseline in optimized builds too.
      - name: Run optimized core and Windows CLI tests
        run: |
          options=()
          if [ "$RUNNER_OS" = Windows ]; then
            options=(-p audiobatch-cli -E 'package(audiobatch-core) | (package(audiobatch-cli) & test(run::test_run_analysis::normalize_))')
          fi
          cargo nextest run --release -p audiobatch-core "${options[@]}" --no-fail-fast

      # Runs the CLI on the committed fixtures and checks the reported level and the exit codes,
      # like the CLI smoke test of the C++ build.
      - name: CLI smoke test
        run: |
          cargo run --quiet --bin audiobatch-rs -- --help
          cargo run --quiet --bin audiobatch-rs -- ../fixtures/sine_stereo_44100_16.wav | tee smoke-output.txt
          grep -- "-6.02" smoke-output.txt
          set +e
          cargo run --quiet --bin audiobatch-rs -- ../fixtures/broken.wav
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 2 ]; then
            echo "Expected exit code 2 for a broken file, got $EXIT_CODE"
            exit 1
          fi

  coverage:
    runs-on: macos-latest
    steps:
      # Checks out JUCE and builds the test VST3 like the build job.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Get JUCE commit
        id: juce
        run: echo "commit=$(git rev-parse HEAD:cpp/JUCE)" >> "$GITHUB_OUTPUT"

      - name: Cache test plugin build
        uses: actions/cache@v6
        with:
          path: test-plugin/build
          key: ${{ runner.os }}-test-plugin-${{ steps.juce.outputs.commit }}-${{ hashFiles('test-plugin/CMakeLists.txt', 'test-plugin/src/**') }}
          restore-keys: ${{ runner.os }}-test-plugin-${{ steps.juce.outputs.commit }}-

      # The tests find the bundle in test-plugin/build, and fail instead of skipping when CI is set and it is missing.
      - name: Build test plugin
        run: ../test-plugin/build.sh

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov and nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run tests with coverage
        run: cargo llvm-cov nextest --workspace --no-fail-fast --no-report

      - name: Write coverage reports
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov report --lcov --output-path target/llvm-cov/lcov.info
          cargo llvm-cov report --html
          {
            echo '## Rust code coverage'
            echo '```text'
            cargo llvm-cov report --summary-only
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: |
            rust/target/llvm-cov/lcov.info
            rust/target/llvm-cov/html
          if-no-files-found: error
