name: Rust

on:
  push:
    branches:
      - main
    paths:
      - ".gitattributes"
      - ".github/workflows/rust.yml"
      - "assets/**"
      - "common.sh"
      - "cpp/JUCE"
      - "cpp/tests/fuzz/corpus/**"
      - "fixtures/**"
      - "rust/**"
      - "test-plugin/**"
      - "tests/**"
      - "!**/*.md"
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/rust.yml"
      - "assets/**"
      - "common.sh"
      - "cpp/JUCE"
      - "cpp/tests/fuzz/corpus/**"
      - "fixtures/**"
      - "rust/**"
      - "test-plugin/**"
      - "tests/**"
      - "!**/*.md"

# Cancel previous runs for PRs but not pushes to main
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: "1"
  # Override target-cpu=native from rust/.cargo/config.toml.
  # Runners have varying CPU capabilities, so native builds can cause illegal instruction errors.
  RUSTFLAGS: ""

defaults:
  run:
    shell: bash
    working-directory: rust

jobs:
  build:
    # The Windows image is the one the C++ workflow uses,
    # since the test plugin needs CMake 4.2 and the Visual Studio generator that comes with it.
    strategy:
      matrix:
        os: [macos-latest, windows-2025-vs2026]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      AUDIOBATCH_REQUIRE_NORMALIZATION_FIXTURES: ${{ startsWith(matrix.os, 'windows-') && '1' || '0' }}
    steps:
      # The Rust port does not use JUCE, but the test VST3 in test-plugin/ is built with it.
      # The JUCE submodule is the only one, and checkout fetches it at depth 1.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: List LFS objects
        if: runner.os == 'Windows'
        working-directory: .
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects

      - name: Restore LFS objects
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}

      - name: Pull LFS files
        if: runner.os == 'Windows'
        working-directory: .
        run: git lfs pull

      - name: Get JUCE commit
        id: juce
        run: echo "commit=$(git rev-parse HEAD:cpp/JUCE)" >> "$GITHUB_OUTPUT"

      - name: Cache test plugin build
        uses: actions/cache@v6
        with:
          path: test-plugin/build
          key: ${{ runner.os }}-test-plugin-${{ steps.juce.outputs.commit }}-${{ hashFiles('test-plugin/CMakeLists.txt', 'test-plugin/src/**') }}
          restore-keys: ${{ runner.os }}-test-plugin-${{ steps.juce.outputs.commit }}-

      # The tests find the bundle in test-plugin/build, and fail instead of skipping when CI is set and it is missing.
      - name: Build test plugin
        run: ../test-plugin/build.sh

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Check Rust shell entry points
        if: runner.os == 'macOS'
        run: uv run --script ../tests/test_rust_scripts.py

      - name: Test parity oracles and benchmark tooling natively
        if: runner.os == 'Windows'
        run: ./test.sh --tooling

      - name: Check formatting
        if: runner.os == 'macOS'
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The fuzz crate is its own workspace, and its targets build on stable outside cargo-fuzz.
      - name: Lint fuzz targets
        if: runner.os == 'macOS'
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

      # The snapshot feature is off in normal builds, so it needs its own compile check.
      - name: Build GUI with the snapshot feature
        if: runner.os == 'macOS'
        run: cargo build -p audiobatch-gui --features snapshot

      # Includes shared fixture checksums, generated input identities, and exact platform goldens.
      # Nextest builds the test targets, avoiding a separate all-targets build.
      - name: Run unit and service tests
        run: ./test.sh --unit

      - name: Nonvisual GUI integration workflows
        timeout-minutes: 5
        run: ./test.sh --gui-integration

      - name: Check distribution license notices
        if: runner.os == 'macOS'
        run: uv run --script scripts/test_distribution_licenses.py

      # Each backend must preserve its platform baseline in optimized builds too.
      - name: Run optimized core and Windows CLI tests
        run: ./test.sh --optimized

      - name: CLI integration contracts
        timeout-minutes: 5
        run: ./test.sh --cli-integration

      - name: Upload integration failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rust-integration-${{ runner.os }}
          path: rust/target/integration-artifacts
          if-no-files-found: ignore

  miri:
    # Checks the unsafe VST3 hosting code, the test plugin, the Serato parsers,
    # and the cache blob readers for undefined behaviour.
    # Needs no JUCE or test plugin bundle, since Miri cannot load native libraries.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up nightly Rust with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri,rust-src

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: miri

      - name: Run tests under Miri
        run: ./miri.sh

  fuzz:
    # Required checks include every corpus and checked decoder regression, but only parser/cache mutations.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/fuzz

      - name: Check exact decoder panic regressions with overflow checks
        run: cargo test --manifest-path fuzz/Cargo.toml --test decoder_regressions

      - name: Build fuzz targets
        run: ./fuzz.sh --build-only

      - name: Replay every corpus including decoder regressions
        run: ./fuzz.sh --no-build --replay

      # New inputs go to a scratch corpus, so the committed corpus stays as it is.
      - name: Fuzz Serato, CLI arguments, and cache blobs (required)
        run: ./fuzz.sh --no-build --fuzz --targets parsers --seconds 60

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rust-fuzz-artifacts
          path: rust/fuzz/artifacts
          if-no-files-found: ignore

  decoder-fuzz-diagnostics:
    name: Decoder mutation fuzz (non-blocking diagnostics)
    # Known Symphonia arithmetic defects remain visible without blocking the required fuzz and Miri jobs.
    continue-on-error: true
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/fuzz
          key: decoder-diagnostics

      - name: Build decoder diagnostic target
        run: ./fuzz.sh --build-only --targets decoder

      # Bash pipefail preserves the fuzzer's real failure through tee. Do not continue at step level.
      - name: Mutate decoder inputs (diagnostic, failures remain visible)
        id: decoder-mutations
        run: |
          mkdir -p fuzz/artifacts
          ./fuzz.sh --no-build --fuzz --targets decoder --seconds 60 2>&1 | tee fuzz/artifacts/decoder-mutations.log

      - name: Report decoder diagnostic outcome
        if: always()
        working-directory: .
        env:
          MUTATION_OUTCOME: ${{ steps.decoder-mutations.outcome }}
          DIAGNOSTIC_STATUS: ${{ job.status }}
        run: |
          {
            printf '## Decoder mutation fuzz, non-blocking diagnostics\n\n'
            printf 'Job status before reporting: %s. Mutation step outcome: %s.\n\n' "$DIAGNOSTIC_STATUS" "$MUTATION_OUTCOME"
            printf 'Known Symphonia 0.6.1 WAV/CAF arithmetic defects remain unfixed.\n'
            printf 'A failed or incomplete campaign is not a clean fuzz result. See the failed step and diagnostic artifacts.\n'
            printf 'Checked decoder regressions, every corpus replay, parser/cache mutations, and Miri remain required.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DIAGNOSTIC_STATUS" != success ] || [ "$MUTATION_OUTCOME" != success ]; then
            printf '::warning::Decoder diagnostics failed or did not complete. Review logs and artifacts, not a clean fuzz result.\n'
          fi

      - name: Upload decoder diagnostic logs and crashing inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-decoder-fuzz-diagnostics
          path: rust/fuzz/artifacts
          if-no-files-found: warn

  coverage:
    runs-on: macos-latest
    steps:
      # Checks out JUCE and builds the test VST3 like the build job.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Get JUCE commit
        id: juce
        run: echo "commit=$(git rev-parse HEAD:cpp/JUCE)" >> "$GITHUB_OUTPUT"

      - name: Cache test plugin build
        uses: actions/cache@v6
        with:
          path: test-plugin/build
          key: ${{ runner.os }}-test-plugin-${{ steps.juce.outputs.commit }}-${{ hashFiles('test-plugin/CMakeLists.txt', 'test-plugin/src/**') }}
          restore-keys: ${{ runner.os }}-test-plugin-${{ steps.juce.outputs.commit }}-

      # The tests find the bundle in test-plugin/build, and fail instead of skipping when CI is set and it is missing.
      - name: Build test plugin
        run: ../test-plugin/build.sh

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov and nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Run tests and CLI subprocesses with coverage
        timeout-minutes: 30
        run: ./coverage.sh --lcov

      - name: Write coverage reports
        if: always()
        run: ./coverage.sh --report-only

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: |
            rust/target/llvm-cov/lcov.info
            rust/target/llvm-cov/html
            rust/target/integration-artifacts
          if-no-files-found: error
