name: ImageControl

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/image-control.yml"
      - "assets/**"
      - "common.sh"
      - "cpp/.clang-format"
      - "cpp/.clang-tidy"
      - "cpp/.cmake-format.yaml"
      - "cpp/cmake/DetectNativeCpu.cpp"
      - "cpp/cmake/Optimizations.cmake"
      - "cpp/cmake/Pluginval.cmake"
      - "cpp/cmake/RunPluginval.cmake"
      - "cpp/JUCE"
      - "cpp/tests/.clang-tidy"
      - "image-control-plugin/**"
      - "pyproject.toml"
      - "uv.lock"
      - "!**/*.md"
  pull_request:
    paths:
      - ".github/workflows/image-control.yml"
      - "assets/**"
      - "common.sh"
      - "cpp/.clang-format"
      - "cpp/.clang-tidy"
      - "cpp/.cmake-format.yaml"
      - "cpp/cmake/DetectNativeCpu.cpp"
      - "cpp/cmake/Optimizations.cmake"
      - "cpp/cmake/Pluginval.cmake"
      - "cpp/cmake/RunPluginval.cmake"
      - "cpp/JUCE"
      - "cpp/tests/.clang-tidy"
      - "image-control-plugin/**"
      - "pyproject.toml"
      - "uv.lock"
      - "!**/*.md"

# Cancel previous runs for PRs but not pushes to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CLICOLOR_FORCE: "1"

defaults:
  run:
    shell: bash
    working-directory: image-control-plugin

jobs:
  build:
    # The C++ workflow's Windows image supplies CMake 4.2 and Visual Studio 2026.
    strategy:
      matrix:
        os: [macos-latest, windows-2025-vs2026]
        build-type: [Debug, Release]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install build tools
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Build and test
        timeout-minutes: 20
        run: ./build.sh --test --build-type "${{ matrix.build-type }}"

      # This target builds the exact pluginval revision pinned in cpp/cmake/Pluginval.cmake.
      # Failure or absence of the validator must fail CI, not silently skip validation.
      - name: Validate VST3 with pinned pluginval
        timeout-minutes: 20
        run: |
          build_type="${{ matrix.build-type }}"
          build_dir="cmake-build-$(printf '%s' "$build_type" | tr '[:upper:]' '[:lower:]')"
          cmake -S . -B "$build_dir" -DAUDIOBATCH_PLUGINVAL=ON
          cmake --build "$build_dir" --config "$build_type" --target ImageControl_pluginval

      # The installer preserves the completed AU bundle signature and checks its registered component with auval.
      - name: Install and validate Audio Unit
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          options=(--reuse --validate)
          if [ "${{ matrix.build-type }}" = Debug ]; then
            options+=(--debug)
          fi
          ./install.sh "${options[@]}"

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: ImageControl-${{ runner.os }}-${{ matrix.build-type }}
          path: |
            image-control-plugin/cmake-build-*/ImageControl_artefacts/${{ matrix.build-type }}/VST3
            image-control-plugin/cmake-build-*/ImageControl_artefacts/${{ matrix.build-type }}/AU
          if-no-files-found: error

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ImageControl-tests-${{ runner.os }}-${{ matrix.build-type }}
          path: image-control-plugin/cmake-build-*/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  lint:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install LLVM and Ninja
        run: brew install llvm ninja

      - name: Run clang-tidy
        run: ./lint.sh --check

  sanitize:
    strategy:
      matrix:
        sanitizer: [address, thread]
      fail-fast: false
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Ninja
        run: brew install ninja

      - name: Run instrumented plugin tests
        run: |
          if [ "${{ matrix.sanitizer }}" = thread ]; then
            ./sanitize.sh --thread
          else
            ./sanitize.sh
          fi

      - name: Upload sanitizer diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ImageControl-sanitizer-${{ matrix.sanitizer }}
          path: image-control-plugin/cmake-build-mac-*/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  coverage:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Ninja
        run: brew install ninja

      - name: Measure plugin source coverage
        run: ./coverage.sh --lcov

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ImageControl-coverage
          path: |
            image-control-plugin/cmake-build-mac-coverage/coverage/lcov.info
            image-control-plugin/cmake-build-mac-coverage/Testing/Temporary/LastTest.log
          if-no-files-found: error

  tooling-tests:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Test format comparison contracts
        run: uv run --script benchmarks/test_compare_formats.py
