name: ImageControl

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/image-control.yml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rustfmt.toml"
      - "assets/**"
      - "common.sh"
      - "cpp/.clang-format"
      - "cpp/.clang-tidy"
      - "cpp/.cmake-format.yaml"
      - "cpp/cmake/DetectNativeCpu.cpp"
      - "cpp/cmake/Optimizations.cmake"
      - "cpp/cmake/Pluginval.cmake"
      - "cpp/cmake/RunPluginval.cmake"
      - "cpp/JUCE"
      - "cpp/tests/.clang-tidy"
      - "image-control-plugin/**"
      - "pyproject.toml"
      - "rust/crates/plugin-host-core/**"
      - "rust/crates/vst3-host/**"
      - "tests/realtime_sanitizer.py"
      - "uv.lock"
      - "!**/*.md"
  pull_request:
    paths:
      - ".github/workflows/image-control.yml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rustfmt.toml"
      - "assets/**"
      - "common.sh"
      - "cpp/.clang-format"
      - "cpp/.clang-tidy"
      - "cpp/.cmake-format.yaml"
      - "cpp/cmake/DetectNativeCpu.cpp"
      - "cpp/cmake/Optimizations.cmake"
      - "cpp/cmake/Pluginval.cmake"
      - "cpp/cmake/RunPluginval.cmake"
      - "cpp/JUCE"
      - "cpp/tests/.clang-tidy"
      - "image-control-plugin/**"
      - "pyproject.toml"
      - "rust/crates/plugin-host-core/**"
      - "rust/crates/vst3-host/**"
      - "tests/realtime_sanitizer.py"
      - "uv.lock"
      - "!**/*.md"

# Superseded runs release the shared runner capacity for both main and pull requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLICOLOR_FORCE: "1"
  RUSTFLAGS: ""
  # Installing nightly for audits must not change the toolchain used by ordinary Cargo commands.
  RUSTUP_TOOLCHAIN: stable

defaults:
  run:
    shell: bash

jobs:
  build:
    # The Windows image supplies CMake 4.2 and Visual Studio 2026.
    # Profiles and audits run sequentially, sharing the checkout, tools, and pinned validator.
    strategy:
      matrix:
        os: [macos-latest, windows-2025-vs2026]
      max-parallel: 1
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          submodules: true

      - name: Install shared native build and audit tools
        id: native_tools
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 15
        working-directory: image-control-plugin
        run: |
          mkdir -p cmake-build-mac-rtsan/realtime-artifacts
          brew install llvm ninja ccache jq ripgrep 2>&1 | tee cmake-build-mac-rtsan/realtime-artifacts/dependencies.log

      - name: Set up stable Rust toolchain
        id: stable
        if: ${{ !cancelled() }}
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 10
        with:
          components: clippy,rustfmt

      - name: Set up uv
        if: ${{ !cancelled() }}
        uses: astral-sh/setup-uv@v10.4.0
        timeout-minutes: 5

      - name: Cache Rust dependencies
        if: ${{ !cancelled() && steps.stable.outcome == 'success' }}
        uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          workspaces: ". -> rust/target"

      # Cache identity is resolved before nightly installation to retain warm ordinary builds across audit updates.
      - name: Set up nightly Rust audit toolchain
        id: nightly
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 10
        with:
          components: miri,rust-src

      # Script validators resolve pluginval through PATH. Put only the exact pinned build first,
      # and require that executable before invoking any script that could fall back to another validator.
      - name: Select shared pinned pluginval path
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: image-control-plugin
        run: |
          repository="$(git rev-parse --show-toplevel)"
          validator_directory="$repository/.deps/pluginval-build/pluginval_artefacts/Release"
          if [ "$RUNNER_OS" = macOS ]; then
            validator_directory="$validator_directory/pluginval.app/Contents/MacOS"
            validator="$validator_directory/pluginval"
          else
            validator="$validator_directory/pluginval.exe"
          fi
          printf 'IMAGE_CONTROL_PLUGINVAL=%s\n' "$validator" >> "$GITHUB_ENV"
          printf '%s\n' "$validator_directory" >> "$GITHUB_PATH"

      - name: Build and test C++ Debug
        id: cpp_debug
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: image-control-plugin
        run: ./build.sh --test --build-type Debug

      # These targets build the exact pluginval revision pinned in cpp/cmake/Pluginval.cmake.
      # Failure or absence of the validator must fail CI, not silently skip validation.
      - name: Validate C++ Debug VST3 with pinned pluginval
        id: cpp_debug_validation
        if: ${{ !cancelled() && steps.cpp_debug.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: image-control-plugin
        run: |
          cmake -S . -B cmake-build-debug -DAUDIOBATCH_PLUGINVAL=ON
          cmake --build cmake-build-debug --config Debug --target ImageControl_pluginval

      # The installer preserves the completed AU signature and requires registered, strict auval validation.
      - name: Install and validate C++ Debug Audio Unit
        id: cpp_debug_install
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.cpp_debug.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: image-control-plugin
        run: |
          test -x "$IMAGE_CONTROL_PLUGINVAL"
          ./install.sh --reuse --validate --debug

      - name: Upload C++ Debug plugin
        if: ${{ !cancelled() && steps.cpp_debug.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: ImageControl-${{ runner.os }}-Debug
          path: |
            image-control-plugin/cmake-build-debug/ImageControl_artefacts/Debug/VST3
            image-control-plugin/cmake-build-debug/ImageControl_artefacts/Debug/AU
          if-no-files-found: error

      - name: Upload C++ Debug test diagnostics
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: ImageControl-tests-${{ runner.os }}-Debug
          path: image-control-plugin/cmake-build-debug/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      - name: Build and test C++ Release
        id: cpp_release
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: image-control-plugin
        run: ./build.sh --test --build-type Release

      - name: Validate C++ Release VST3 and build shared parity host
        id: cpp_release_validation
        if: ${{ !cancelled() && steps.cpp_release.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: image-control-plugin
        run: |
          cmake -S . -B cmake-build-release -DAUDIOBATCH_PLUGINVAL=ON
          cmake --build cmake-build-release --config Release --target ImageControlParity ImageControl_pluginval

      - name: Install and validate C++ Release Audio Unit
        id: cpp_release_install
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.cpp_release.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: image-control-plugin
        run: |
          test -x "$IMAGE_CONTROL_PLUGINVAL"
          ./install.sh --reuse --validate

      - name: Upload C++ Release plugin
        if: ${{ !cancelled() && steps.cpp_release.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: ImageControl-${{ runner.os }}-Release
          path: |
            image-control-plugin/cmake-build-release/ImageControl_artefacts/Release/VST3
            image-control-plugin/cmake-build-release/ImageControl_artefacts/Release/AU
          if-no-files-found: error

      - name: Upload C++ Release test diagnostics
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: ImageControl-tests-${{ runner.os }}-Release
          path: image-control-plugin/cmake-build-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      # A C++ validation finding must not suppress independent Rust contracts when the pinned binary exists.
      - name: Require the shared pinned validator for Rust formats
        id: validator
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: image-control-plugin/rust
        run: test -x "$IMAGE_CONTROL_PLUGINVAL"

      - name: Check Rust formatting
        if: ${{ !cancelled() && steps.stable.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: image-control-plugin/rust
        run: ./format.sh --check

      - name: Check Rust lints
        if: ${{ !cancelled() && steps.stable.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: image-control-plugin/rust
        run: ./lint.sh --check

      - name: Check Rust without default features
        if: ${{ !cancelled() && steps.stable.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: image-control-plugin/rust
        run: cargo check -p image-control-plugin-rs --no-default-features

      - name: Test Rust without default features
        if: ${{ !cancelled() && steps.stable.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: image-control-plugin/rust
        run: cargo test -p image-control-plugin-rs --no-default-features --lib

      - name: Build and test Debug Rust VST3, CLAP, and macOS AU
        id: rust_debug
        if: ${{ !cancelled() && steps.stable.outcome == 'success' && steps.validator.outcome == 'success' }}
        timeout-minutes: 30
        working-directory: image-control-plugin/rust
        run: ./build.sh --debug --test --validate

      - name: Check Debug Rust packaged-format contracts
        if: ${{ !cancelled() && steps.rust_debug.outcome == 'success' }}
        timeout-minutes: 15
        working-directory: image-control-plugin/rust
        run: ./test.sh

      - name: Test Debug Rust CLAP host
        if: ${{ !cancelled() && steps.rust_debug.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: image-control-plugin/rust
        run: cargo test -p image-control-plugin-rs --example clap_host

      - name: Check Debug Rust CLAP state interaction
        if: ${{ !cancelled() && steps.rust_debug.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: image-control-plugin/rust
        run: |
          cargo run -p image-control-plugin-rs --example clap_host -- --case clap-state-interaction --bundle \
            "$(git rev-parse --show-toplevel)/rust/target/bundled/ImageControl RS.clap"

      # The bundler publishes both profiles to the same directory. Capture Debug before building Release.
      - name: Upload Debug Rust format bundles
        if: ${{ !cancelled() && steps.rust_debug.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: ImageControl-RS-${{ runner.os }}-Debug
          path: rust/target/bundled/ImageControl RS.*
          if-no-files-found: error

      - name: Build and test Release Rust VST3, CLAP, and macOS AU
        id: rust_release
        if: ${{ !cancelled() && steps.stable.outcome == 'success' && steps.validator.outcome == 'success' }}
        timeout-minutes: 30
        working-directory: image-control-plugin/rust
        run: ./build.sh --test --validate

      - name: Check Release Rust packaged-format contracts
        if: ${{ !cancelled() && steps.rust_release.outcome == 'success' }}
        timeout-minutes: 15
        working-directory: image-control-plugin/rust
        run: ./test.sh

      - name: Test Release Rust CLAP host
        if: ${{ !cancelled() && steps.rust_release.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: image-control-plugin/rust
        run: cargo test -p image-control-plugin-rs --release --example clap_host

      - name: Check Release Rust CLAP state interaction
        if: ${{ !cancelled() && steps.rust_release.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: image-control-plugin/rust
        run: |
          cargo run -p image-control-plugin-rs --release --example clap_host -- --case clap-state-interaction --bundle \
            "$(git rev-parse --show-toplevel)/rust/target/bundled/ImageControl RS.clap"

      - name: Check Release Rust VST3 editor reentry
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.rust_release.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: image-control-plugin/rust
        run: |
          cargo run -p image-control-plugin-rs --example editor_reentry -- --bundle \
            "$(git rev-parse --show-toplevel)/rust/target/bundled/ImageControl RS.vst3"

      # Invoke the exact pinned build directly. Do not accept an unrelated validator found on PATH.
      - name: Gate Release Rust VST3 with pinned pluginval strictness 10
        if: ${{ !cancelled() && steps.rust_release.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: image-control-plugin/rust
        run: |
          test -x "$IMAGE_CONTROL_PLUGINVAL"
          "$IMAGE_CONTROL_PLUGINVAL" validate --strictness-level 10 \
            "$(git rev-parse --show-toplevel)/rust/target/bundled/ImageControl RS.vst3"

      - name: Qualify native Rust CLAP editor
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.rust_release.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: image-control-plugin/rust
        run: |
          cargo run -p image-control-plugin-rs --example clap_editor -- --bundle \
            "$(git rev-parse --show-toplevel)/rust/target/bundled/ImageControl RS.clap"

      - name: Qualify native Rust AU editor
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.rust_release.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: image-control-plugin/rust
        run: |
          repository="$(git rev-parse --show-toplevel)"
          architecture="$(uname -m)"
          "$repository/rust/target/image-control-au/$architecture/release/ImageControlRSAUHost" --editor --bundle \
            "$repository/rust/target/bundled/ImageControl RS.component"

      - name: Install and validate the Rust Audio Unit
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.rust_release.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: image-control-plugin/rust
        run: |
          test -x "$IMAGE_CONTROL_PLUGINVAL"
          ./install.sh --no-build --validate

      - name: Upload Release Rust format bundles
        if: ${{ !cancelled() && steps.rust_release.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: ImageControl-RS-${{ runner.os }}-Release
          path: rust/target/bundled/ImageControl RS.*
          if-no-files-found: error

      - name: Compare both packaged implementations
        id: parity
        if: ${{ !cancelled() && steps.cpp_release.outcome == 'success' && steps.rust_release.outcome == 'success' }}
        timeout-minutes: 15
        working-directory: image-control-plugin/rust
        run: |
          repository="$(git rev-parse --show-toplevel)"
          parity="$repository/image-control-plugin/cmake-build-release/ImageControlParity_artefacts/Release/ImageControlParity"
          if [ "$RUNNER_OS" = Windows ]; then
            parity="$parity.exe"
          fi
          ./parity.sh \
            --cpp "$repository/image-control-plugin/cmake-build-release/ImageControl_artefacts/Release/VST3/ImageControl.vst3" \
            --executable "$parity"

      - name: Upload cross-implementation diagnostics
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: image-control-parity-${{ runner.os }}
          path: rust/target/image-control-parity
          if-no-files-found: ignore

      # Independent audit phases remain required and run after earlier failures, unless the run is cancelled.
      - name: Run C++ clang-tidy
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 30
        working-directory: image-control-plugin
        run: ./lint.sh --check

      - name: Release ordinary C++ build storage after parity and lint
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        working-directory: image-control-plugin
        run: rm -rf cmake-build-debug cmake-build-release

      - name: Run C++ AddressSanitizer and UndefinedBehaviorSanitizer tests
        id: cpp_address
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 30
        working-directory: image-control-plugin
        run: ./sanitize.sh

      - name: Upload C++ address sanitizer diagnostics
        if: ${{ !cancelled() && runner.os == 'macOS' && failure() }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: ImageControl-sanitizer-address
          path: image-control-plugin/cmake-build-mac-asan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      - name: Release C++ address sanitizer build storage
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        working-directory: image-control-plugin
        run: rm -rf cmake-build-mac-asan

      - name: Run C++ ThreadSanitizer tests
        id: cpp_thread
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 30
        working-directory: image-control-plugin
        run: ./sanitize.sh --thread

      - name: Upload C++ thread sanitizer diagnostics
        if: ${{ !cancelled() && runner.os == 'macOS' && failure() }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: ImageControl-sanitizer-thread
          path: image-control-plugin/cmake-build-mac-tsan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      - name: Release C++ thread sanitizer build storage
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        working-directory: image-control-plugin
        run: rm -rf cmake-build-mac-tsan

      - name: Record native sanitizer toolchain
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 5
        working-directory: image-control-plugin
        run: |
          {
            uname -sm
            "$(brew --prefix llvm)/bin/clang++" --version
            cmake --version
            ninja --version
            uv --version
          } 2>&1 | tee cmake-build-mac-rtsan/realtime-artifacts/toolchain.log

      # Hosts the build-tree VST3 with startup-linked RTSan, without installation or physical audio devices.
      # Expected baseline findings remain BLOCKED in result.json, not clean callback passes.
      - name: Check C++ callbacks and verify known blockers
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 45
        working-directory: image-control-plugin
        run: ./sanitize.sh --realtime 2>&1 | tee cmake-build-mac-rtsan/realtime-artifacts/run.log

      - name: Upload C++ realtime sanitizer diagnostics
        if: ${{ always() && runner.os == 'macOS' && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: ImageControl-realtime-sanitizer
          path: |
            image-control-plugin/cmake-build-mac-rtsan/realtime-artifacts
            image-control-plugin/cmake-build-mac-rtsan/Testing/Temporary/LastTest.log
            image-control-plugin/cmake-build-mac-rtsan/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: error

      - name: Release C++ realtime sanitizer build storage after uploading evidence
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        working-directory: image-control-plugin
        run: rm -rf cmake-build-mac-rtsan

      - name: Measure C++ plugin source coverage
        id: cpp_coverage
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 30
        working-directory: image-control-plugin
        run: ./coverage.sh --lcov

      - name: Upload C++ coverage
        if: ${{ always() && runner.os == 'macOS' && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: ImageControl-coverage
          path: |
            image-control-plugin/cmake-build-mac-coverage/coverage/lcov.info
            image-control-plugin/cmake-build-mac-coverage/Testing/Temporary/LastTest.log
          if-no-files-found: error

      - name: Release C++ coverage build storage after uploading reports
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        working-directory: image-control-plugin
        run: rm -rf cmake-build-mac-coverage

      - name: Check Rust scalar and admission contracts under Miri
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.nightly.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: image-control-plugin/rust
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/image-control-miri-target
        run: ./test.sh --miri

      - name: Release Rust Miri build storage
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        working-directory: image-control-plugin/rust
        run: rm -rf "$RUNNER_TEMP/image-control-miri-target"

      # Each packaged format has its own detector controls, callback evidence, and bounded required step.
      - name: Build and require clean Rust VST3 callbacks
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.nightly.outcome == 'success' }}
        timeout-minutes: 45
        working-directory: image-control-plugin/rust
        run: ./rtsan.sh --format vst3

      - name: Build and require clean Rust CLAP callbacks
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.nightly.outcome == 'success' }}
        timeout-minutes: 45
        working-directory: image-control-plugin/rust
        run: ./rtsan.sh --format clap

      # AU dependency findings are verified BLOCKED audits, never clean VST3/CLAP callback results.
      - name: Verify known Rust AU dependency callback blockers
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.nightly.outcome == 'success' }}
        timeout-minutes: 45
        working-directory: image-control-plugin/rust
        run: ./rtsan.sh --format au --diagnostic

      - name: Upload Rust sanitizer evidence
        if: ${{ always() && runner.os == 'macOS' && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: image-control-rust-realtime
          path: image-control-plugin/rust/target/rtsan-own/artifacts
          if-no-files-found: error

      - name: Install Rust license audit tool
        id: cargo_deny
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.stable.outcome == 'success' }}
        uses: taiki-e/install-action@v2
        timeout-minutes: 10
        with:
          tool: cargo-deny

      - name: Audit Rust dependency licenses
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.cargo_deny.outcome == 'success' }}
        timeout-minutes: 15
        working-directory: image-control-plugin/rust
        run: ./test.sh --licenses
