name: ImageControl

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/image-control.yml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rustfmt.toml"
      - "assets/**"
      - "common.sh"
      - "cpp/.clang-format"
      - "cpp/.clang-tidy"
      - "cpp/.cmake-format.yaml"
      - "cpp/cmake/DetectNativeCpu.cpp"
      - "cpp/cmake/Optimizations.cmake"
      - "cpp/cmake/Pluginval.cmake"
      - "cpp/cmake/RunPluginval.cmake"
      - "cpp/JUCE"
      - "cpp/tests/.clang-tidy"
      - "image-control-plugin/**"
      - "pyproject.toml"
      - "tests/realtime_sanitizer.py"
      - "tests/test_realtime_sanitizer.py"
      - "tests/test_realtime_scripts.py"
      - "uv.lock"
      - "!**/*.md"
  pull_request:
    paths:
      - ".github/workflows/image-control.yml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rustfmt.toml"
      - "assets/**"
      - "common.sh"
      - "cpp/.clang-format"
      - "cpp/.clang-tidy"
      - "cpp/.cmake-format.yaml"
      - "cpp/cmake/DetectNativeCpu.cpp"
      - "cpp/cmake/Optimizations.cmake"
      - "cpp/cmake/Pluginval.cmake"
      - "cpp/cmake/RunPluginval.cmake"
      - "cpp/JUCE"
      - "cpp/tests/.clang-tidy"
      - "image-control-plugin/**"
      - "pyproject.toml"
      - "tests/realtime_sanitizer.py"
      - "tests/test_realtime_sanitizer.py"
      - "tests/test_realtime_scripts.py"
      - "uv.lock"
      - "!**/*.md"

# Cancel previous runs for PRs but not pushes to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CLICOLOR_FORCE: "1"
  RUSTFLAGS: ""

defaults:
  run:
    shell: bash
    working-directory: image-control-plugin

jobs:
  build:
    # The C++ workflow's Windows image supplies CMake 4.2 and Visual Studio 2026.
    strategy:
      matrix:
        os: [macos-latest, windows-2025-vs2026]
        build-type: [Debug, Release]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install build tools
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Build and test
        timeout-minutes: 20
        run: ./build.sh --test --build-type "${{ matrix.build-type }}"

      # This target builds the exact pluginval revision pinned in cpp/cmake/Pluginval.cmake.
      # Failure or absence of the validator must fail CI, not silently skip validation.
      - name: Validate VST3 with pinned pluginval
        timeout-minutes: 20
        run: |
          build_type="${{ matrix.build-type }}"
          build_dir="cmake-build-$(printf '%s' "$build_type" | tr '[:upper:]' '[:lower:]')"
          cmake -S . -B "$build_dir" -DAUDIOBATCH_PLUGINVAL=ON
          cmake --build "$build_dir" --config "$build_type" --target ImageControl_pluginval

      # The installer preserves the completed AU bundle signature and checks its registered component with auval.
      - name: Install and validate Audio Unit
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          options=(--reuse --validate)
          if [ "${{ matrix.build-type }}" = Debug ]; then
            options+=(--debug)
          fi
          ./install.sh "${options[@]}"

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: ImageControl-${{ runner.os }}-${{ matrix.build-type }}
          path: |
            image-control-plugin/cmake-build-*/ImageControl_artefacts/${{ matrix.build-type }}/VST3
            image-control-plugin/cmake-build-*/ImageControl_artefacts/${{ matrix.build-type }}/AU
          if-no-files-found: error

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ImageControl-tests-${{ runner.os }}-${{ matrix.build-type }}
          path: image-control-plugin/cmake-build-*/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  rust-contracts:
    name: Rust and cross-implementation contracts (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-2025-vs2026]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: image-control-plugin/rust
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> rust/target"

      - name: Check Rust formatting and lints
        run: |
          ./format.sh --check
          ./lint.sh --check
          cargo check -p image-control-plugin-rs --no-default-features
          cargo test -p image-control-plugin-rs --no-default-features --lib

      - name: Check parity and benchmark runner contracts
        if: runner.os == 'macOS'
        working-directory: .
        run: |
          uv run --script image-control-plugin/tests/test_parity_runner.py
          uv run --script image-control-plugin/rust/tests/test_benchmark_script.py
          uv run --script image-control-plugin/rust/tests/test_install_script.py

      - name: Build and test Debug Rust VST3, CLAP, and macOS AU
        run: |
          ./build.sh --debug --test --validate
          ./test.sh

      - name: Build and test Release Rust VST3, CLAP, and macOS AU
        run: |
          ./build.sh --test --validate
          ./test.sh
          if [ "$RUNNER_OS" = macOS ]; then
            cargo run -p image-control-plugin-rs --example editor_reentry -- --bundle \
              "$(git rev-parse --show-toplevel)/rust/target/bundled/ImageControl RS.vst3"
          fi

      - name: Qualify native CLAP and AU editors
        if: runner.os == 'macOS'
        run: |
          repository="$(git rev-parse --show-toplevel)"
          cargo run -p image-control-plugin-rs --example clap_editor -- --bundle \
            "$repository/rust/target/bundled/ImageControl RS.clap"
          architecture="$(uname -m)"
          "$repository/rust/target/image-control-au/$architecture/release/ImageControlRSAUHost" --editor --bundle \
            "$repository/rust/target/bundled/ImageControl RS.component"

      - name: Install and validate the Rust Audio Unit
        if: runner.os == 'macOS'
        run: ./install.sh --no-build --validate

      - name: Upload Rust format bundles
        uses: actions/upload-artifact@v7
        with:
          name: ImageControl-RS-${{ runner.os }}
          path: rust/target/bundled/ImageControl RS.*
          if-no-files-found: error

      - name: Build C++ VST3 and parity host
        working-directory: image-control-plugin
        run: |
          ./build.sh --test --build-type Release
          cmake --build cmake-build-release --config Release --target ImageControlParity

      - name: Compare both packaged implementations
        run: |
          repository="$(git rev-parse --show-toplevel)"
          parity="$repository/image-control-plugin/cmake-build-release/ImageControlParity_artefacts/Release/ImageControlParity"
          if [ "$RUNNER_OS" = Windows ]; then
            parity="$parity.exe"
          fi
          ./parity.sh \
            --cpp "$repository/image-control-plugin/cmake-build-release/ImageControl_artefacts/Release/VST3/ImageControl.vst3" \
            --executable "$parity"

      - name: Compile Criterion benchmarks
        run: cargo bench -p image-control-dsp --no-run

      - name: Upload cross-implementation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: image-control-parity-${{ runner.os }}
          path: rust/target/image-control-parity
          if-no-files-found: ignore

  rust-miri:
    name: Rust scalar and admission Miri
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: image-control-plugin/rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri,rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> rust/target"
          key: image-control-miri
      - run: ./test.sh --miri

  rust-realtime:
    name: Rust packaged RealtimeSanitizer
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: image-control-plugin/rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install matching native audit prerequisites
        run: brew install llvm jq ripgrep
      - name: Build and require clean VST3 and CLAP callbacks
        run: |
          ./rtsan.sh --format vst3
          ./rtsan.sh --format clap
      - name: Verify known AU dependency callback blockers
        run: ./rtsan.sh --format au --diagnostic
      - name: Upload sanitizer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-control-rust-realtime
          path: image-control-plugin/rust/target/rtsan-own/artifacts
          if-no-files-found: error

  rust-licenses:
    name: Rust dependency license audit
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: image-control-plugin/rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: ./test.sh --licenses

  lint:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install LLVM and Ninja
        run: brew install llvm ninja

      - name: Run clang-tidy
        run: ./lint.sh --check

  sanitize:
    strategy:
      matrix:
        sanitizer: [address, thread]
      fail-fast: false
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Ninja
        run: brew install ninja

      - name: Run instrumented plugin tests
        run: |
          if [ "${{ matrix.sanitizer }}" = thread ]; then
            ./sanitize.sh --thread
          else
            ./sanitize.sh
          fi

      - name: Upload sanitizer diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ImageControl-sanitizer-${{ matrix.sanitizer }}
          path: image-control-plugin/cmake-build-mac-*/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  realtime:
    name: RealtimeSanitizer
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Homebrew LLVM and Ninja
        run: |
          mkdir -p cmake-build-mac-rtsan/realtime-artifacts
          brew install llvm ninja 2>&1 | tee cmake-build-mac-rtsan/realtime-artifacts/dependencies.log

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Record native sanitizer toolchain
        run: |
          {
            uname -sm
            "$(brew --prefix llvm)/bin/clang++" --version
            cmake --version
            ninja --version
            uv --version
          } 2>&1 | tee cmake-build-mac-rtsan/realtime-artifacts/toolchain.log

      # Hosts the build-tree VST3 with startup-linked RTSan, without installation or physical audio devices.
      # Expected baseline findings remain BLOCKED in result.json, not clean callback passes.
      - name: Check callbacks and verify known blockers
        run: ./sanitize.sh --realtime 2>&1 | tee cmake-build-mac-rtsan/realtime-artifacts/run.log

      - name: Upload realtime sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ImageControl-realtime-sanitizer
          path: |
            image-control-plugin/cmake-build-mac-rtsan/realtime-artifacts
            image-control-plugin/cmake-build-mac-rtsan/Testing/Temporary/LastTest.log
            image-control-plugin/cmake-build-mac-rtsan/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: error

  coverage:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Ninja
        run: brew install ninja

      - name: Measure plugin source coverage
        run: ./coverage.sh --lcov

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ImageControl-coverage
          path: |
            image-control-plugin/cmake-build-mac-coverage/coverage/lcov.info
            image-control-plugin/cmake-build-mac-coverage/Testing/Temporary/LastTest.log
          if-no-files-found: error

  tooling-tests:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Test format comparison contracts
        run: uv run --script benchmarks/test_compare_formats.py

      - name: Test build and validation script contracts
        run: uv run --script tests/test_build_scripts.py

      - name: Test shared realtime runner and script contracts
        run: |
          uv run --script ../tests/test_realtime_sanitizer.py
          uv run --script ../tests/test_realtime_scripts.py
