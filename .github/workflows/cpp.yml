name: C++

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cpp.yml"
      - "assets/**"
      - "common.sh"
      - "cpp/**"
      - "fixtures/**"
      - "!fixtures/normalization/**"
      - "test-plugin/**"
      - "tests/**"
      - "!**/*.md"
  pull_request:
    paths:
      - ".github/workflows/cpp.yml"
      - "assets/**"
      - "common.sh"
      - "cpp/**"
      - "fixtures/**"
      - "!fixtures/normalization/**"
      - "test-plugin/**"
      - "tests/**"
      - "!**/*.md"

# Superseded runs on the same PR or branch release their runner immediately.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: cpp

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-2025-vs2026]
      max-parallel: 1
      fail-fast: false
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Create the diagnostics directory before installing tools so failures retain their evidence.
      # Skip Homebrew's automatic update and reuse these dependencies across every macOS phase.
      - name: Install LLVM, Ninja, and ccache
        id: native-dependencies
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.checkout.outcome == 'success' }}
        timeout-minutes: 15
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          mkdir -p cmake-build-mac-rtsan/realtime-artifacts
          brew install llvm ninja ccache 2>&1 | tee cmake-build-mac-rtsan/realtime-artifacts/dependencies.log

      - name: Set up uv
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: astral-sh/setup-uv@v10.4.0

      - name: Get JUCE commit
        id: juce
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 1
        run: echo "commit=$(git rev-parse HEAD:cpp/JUCE)" >> "$GITHUB_OUTPUT"

      # One archive owns both profiles and their embedded ccache directories.
      # Parity restores the same key and path list without saving a duplicate archive.
      - name: Restore CMake build directories and ccache
        id: cmake-cache
        if: ${{ !cancelled() && steps.juce.outcome == 'success' }}
        uses: actions/cache/restore@v6
        with:
          path: |
            cpp/cmake-build-mac-debug
            cpp/cmake-build-mac-release
            cpp/cmake-build-windows-debug
            cpp/cmake-build-windows-release
          key: ${{ runner.os }}-suite-cmake-${{ steps.juce.outputs.commit }}-${{ hashFiles('cpp/CMakeLists.txt', 'cpp/CMakePresets.json', 'cpp/cmake/*.cmake', 'test-plugin/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-suite-cmake-

      # Independent checks run after earlier failures without making any required check non-blocking.
      - name: Build Debug GUI and CLI
        id: debug-build
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: ./build.sh --build-type Debug

      - name: Build Debug tests
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: ./test.sh --build-type Debug --build-only

      - name: Run Debug unit suites
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: ./test.sh --build-type Debug --unit --no-build

      # The GUI workflows drive a transparent desktop window through its peer,
      # using the macOS and Windows runners' logged-in desktop sessions.
      - name: Debug CLI contracts and driven GUI integration
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: ./test.sh --build-type Debug --integration --no-build

      # CTest's integration label includes the shared executable CLI contracts and driven GUI workflows.
      - name: Upload Debug integration diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cpp-integration-${{ runner.os }}-Debug
          path: |
            cpp/cmake-build-*-debug/integration-artifacts
            cpp/cmake-build-*-debug/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      # Release compiles out JUCE assertions and enables optimizer-only warnings and behaviour.
      - name: Build Release GUI and CLI
        id: release-build
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: ./build.sh --build-type Release

      - name: Build Release tests
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: ./test.sh --build-type Release --build-only

      - name: Run Release unit suites
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: ./test.sh --build-type Release --unit --no-build

      - name: Release CLI contracts and driven GUI integration
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: ./test.sh --build-type Release --integration --no-build

      - name: Upload Release integration diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cpp-integration-${{ runner.os }}-Release
          path: |
            cpp/cmake-build-*-release/integration-artifacts
            cpp/cmake-build-*-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      # Save ordinary build state before audits, which can legitimately report required failures.
      - name: Save shared CMake build cache
        if: ${{ !cancelled() && steps.debug-build.outcome == 'success' && steps.release-build.outcome == 'success' && steps.cmake-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            cpp/cmake-build-mac-debug
            cpp/cmake-build-mac-release
            cpp/cmake-build-windows-debug
            cpp/cmake-build-windows-release
          key: ${{ steps.cmake-cache.outputs.cache-primary-key }}

      - name: Unit, GUI, and CLI subprocess coverage
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 30
        run: ./coverage.sh --lcov

      - name: Upload coverage and integration diagnostics
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: cpp-coverage
          path: |
            cpp/cmake-build-mac-coverage/coverage/lcov.info
            cpp/cmake-build-mac-coverage/integration-artifacts
            cpp/cmake-build-mac-coverage/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      # --prepare refreshes the compile database and generated headers without compiling the applications.
      # lint.sh selects Homebrew clang-tidy while CMake retains the build's Apple toolchain.
      - name: Prepare Debug workspace and run clang-tidy
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 45
        run: ./lint.sh --prepare --build-type Debug --check

      - name: Release ordinary and coverage build storage
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: rm -rf cmake-build-mac-debug cmake-build-mac-release cmake-build-mac-coverage

      - name: Build and run macOS unit tests with ASan and UBSan
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 30
        run: ./sanitize.sh

      - name: Upload address sanitizer diagnostics
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: cpp-address-sanitizer
          path: cpp/cmake-build-mac-asan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      - name: Release address sanitizer build storage
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: rm -rf cmake-build-mac-asan

      # ThreadSanitizer uses its own workspace because it cannot be combined with AddressSanitizer.
      - name: Build and run macOS unit tests with TSan
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 30
        run: ./sanitize.sh --thread

      - name: Upload thread sanitizer diagnostics
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: cpp-thread-sanitizer
          path: cpp/cmake-build-mac-tsan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      - name: Release thread sanitizer build storage
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: rm -rf cmake-build-mac-tsan

      - name: Release ordinary Windows build storage after caching
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: rm -rf cmake-build-windows-debug cmake-build-windows-release

      - name: Build and run Windows unit tests with MSVC ASan
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 30
        run: ./sanitize.sh

      - name: Record native sanitizer toolchain
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 2
        run: |
          mkdir -p cmake-build-mac-rtsan/realtime-artifacts
          {
            uname -sm
            "$(brew --prefix llvm)/bin/clang++" --version
            cmake --version
            ninja --version
            uv --version
          } 2>&1 | tee cmake-build-mac-rtsan/realtime-artifacts/toolchain.log

      # The isolated executable links RTSan at startup and never opens a physical audio device.
      # Expected baseline findings remain BLOCKED in result.json, not clean callback passes.
      - name: Check callbacks and verify known blockers with RTSan
        id: realtime
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 35
        run: ./sanitize.sh --realtime 2>&1 | tee cmake-build-mac-rtsan/realtime-artifacts/run.log

      - name: Upload realtime sanitizer diagnostics
        if: ${{ !cancelled() && runner.os == 'macOS' && (steps.native-dependencies.outcome != 'skipped' || steps.realtime.outcome != 'skipped') }}
        uses: actions/upload-artifact@v7
        with:
          name: cpp-realtime-sanitizer
          path: |
            cpp/cmake-build-mac-rtsan/realtime-artifacts
            cpp/cmake-build-mac-rtsan/Testing/Temporary/LastTest.log
            cpp/cmake-build-mac-rtsan/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: error

      - name: Release realtime sanitizer build storage
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: rm -rf cmake-build-mac-rtsan

      # The macos-fuzz preset uses Homebrew LLVM's libFuzzer runtime.
      - name: Build fuzz harnesses
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 20
        run: ./fuzz.sh --build-only

      # The harnesses exist only in the macos-fuzz compile database.
      - name: Run clang-tidy on the fuzz harnesses
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 15
        run: ./lint.sh --check --fuzz

      - name: Replay committed fuzz corpus
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 5
        run: ./fuzz.sh --no-build --replay

      # New inputs go to a scratch corpus, so the committed corpus remains unchanged.
      - name: Fuzz each harness for 60 seconds
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 5
        run: ./fuzz.sh --no-build --fuzz --seconds 60

      - name: Upload crashing inputs
        if: ${{ !cancelled() && runner.os == 'macOS' && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: cpp/fuzz-artifacts
          if-no-files-found: ignore
