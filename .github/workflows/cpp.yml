name: C++

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cpp.yml"
      - "assets/**"
      - "common.sh"
      - "cpp/**"
      - "fixtures/**"
      - "!fixtures/normalization/**"
      - "test-plugin/**"
      - "tests/**"
      - "!**/*.md"
  pull_request:
    paths:
      - ".github/workflows/cpp.yml"
      - "assets/**"
      - "common.sh"
      - "cpp/**"
      - "fixtures/**"
      - "!fixtures/normalization/**"
      - "test-plugin/**"
      - "tests/**"
      - "!**/*.md"

# Cancel previous runs for PRs but not pushes to main
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: cpp

jobs:
  build:
    # Release builds compile out the JUCE assertions and turn on the optimizer,
    # so they catch warnings and behaviour that only show up there.
    strategy:
      matrix:
        os: [macos-latest, windows-2025-vs2026]
        build-type: [Debug, Release]
      fail-fast: false
    name: build (${{ matrix.os }}, ${{ matrix.build-type }})
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TYPE: ${{ matrix.build-type }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install ccache
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install ccache

      - name: Get JUCE commit
        id: juce
        run: echo "commit=$(git rev-parse HEAD:cpp/JUCE)" >> "$GITHUB_OUTPUT"

      # The ccache cache lives inside the build directory (build.sh sets CCACHE_DIR),
      # so caching the build directories also caches the compilation cache.
      # The key changes with the build configuration and JUCE, not with every commit,
      # so the cache is saved once per configuration instead of once per commit.
      # The lint and parity jobs restore this cache, and a cache only restores with the same path list it was saved with.
      - name: Cache CMake build directory and ccache
        uses: actions/cache@v6
        with:
          path: |
            cpp/cmake-build-mac-debug
            cpp/cmake-build-mac-release
            cpp/cmake-build-windows-debug
            cpp/cmake-build-windows-release
          key: ${{ runner.os }}-${{ matrix.build-type }}-cmake-${{ steps.juce.outputs.commit }}-${{ hashFiles('cpp/CMakeLists.txt', 'cpp/CMakePresets.json', 'cpp/cmake/*.cmake', 'test-plugin/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-${{ matrix.build-type }}-cmake-

      - name: Build
        run: ./build.sh --build-type "$BUILD_TYPE"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Build tests and run unit suites
        timeout-minutes: 30
        run: |
          ./test.sh --build-type "$BUILD_TYPE" --build-only
          ./test.sh --build-type "$BUILD_TYPE" --unit --no-build

      - name: CLI contracts and nonvisual GUI integration
        timeout-minutes: 5
        run: ./test.sh --build-type "$BUILD_TYPE" --integration --no-build

      # CTest's integration label includes the shared executable CLI contracts and the nonvisual GUI workflows.
      - name: Upload integration failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cpp-integration-${{ runner.os }}-${{ matrix.build-type }}
          path: |
            cpp/cmake-build-*/integration-artifacts
            cpp/cmake-build-*/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  coverage:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ninja and ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install ninja ccache

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Unit, GUI, and CLI subprocess coverage
        timeout-minutes: 30
        run: ./coverage.sh --lcov

      - name: Upload coverage and integration diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpp-coverage
          path: |
            cpp/cmake-build-mac-coverage/coverage/lcov.info
            cpp/cmake-build-mac-coverage/integration-artifacts
            cpp/cmake-build-mac-coverage/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  lint:
    # Use macOS with the latest LLVM from Homebrew, since Ubuntu apt has an older clang-tidy
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Skip the automatic `brew update`, which takes minutes and is not needed for the runner image's formulae.
      # The restored build directory was configured with ccache as the compiler launcher, so ccache must exist.
      - name: Install LLVM, Ninja, and ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install llvm ninja ccache

      - name: Get JUCE commit
        id: juce
        run: echo "commit=$(git rev-parse HEAD:cpp/JUCE)" >> "$GITHUB_OUTPUT"

      # Restores a macOS Debug cache saved by the build job of an earlier run,
      # since this job runs alongside the build job of the same run.
      # It holds the same cmake-build-mac-debug directory, including the fetched dependencies.
      # The path list must match the build job's for the cache to restore.
      # Restore-only, since the build job owns saving it.
      - name: Restore CMake build directory
        uses: actions/cache/restore@v6
        with:
          path: |
            cpp/cmake-build-mac-debug
            cpp/cmake-build-mac-release
            cpp/cmake-build-windows-debug
            cpp/cmake-build-windows-release
          key: ${{ runner.os }}-Debug-cmake-${{ steps.juce.outputs.commit }}-${{ hashFiles('cpp/CMakeLists.txt', 'cpp/CMakePresets.json', 'cpp/cmake/*.cmake', 'test-plugin/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-Debug-cmake-

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Test shell script contracts
        run: |
          uv run --script ../tests/test_cpp_lint.py
          uv run --script ../tests/test_cpp_test.py

      # --prepare refreshes the compile database and generated headers without compiling the applications.
      # lint.sh selects Homebrew clang-tidy while CMake retains the build job's Apple toolchain.
      - name: Prepare workspace and run clang-tidy
        run: ./lint.sh --prepare --build-type Debug --check

  sanitize:
    # Runs the unit tests on macOS under AddressSanitizer and UndefinedBehaviorSanitizer,
    # and under ThreadSanitizer, which cannot be combined with AddressSanitizer.
    # On Windows, they run under the MSVC AddressSanitizer.
    strategy:
      matrix:
        include:
          - os: macos-latest
            sanitizer: address
          - os: macos-latest
            sanitizer: thread
          - os: windows-2025-vs2026
            sanitizer: address
      fail-fast: false
    name: sanitize (${{ matrix.os }}, ${{ matrix.sanitizer }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ninja
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install ninja

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Build and run tests with sanitizers
        run: |
          if [ "${{ matrix.sanitizer }}" = "thread" ]; then
            ./sanitize.sh --thread
          else
            ./sanitize.sh
          fi

  fuzz:
    # Replays the committed corpus through each libFuzzer harness, then fuzzes each one briefly.
    # The macos-fuzz preset uses Homebrew LLVM, since Apple Clang does not ship libFuzzer.
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install LLVM and Ninja
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install llvm ninja

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Build harnesses
        run: ./fuzz.sh --build-only

      # The harnesses are only in the compile database of the macos-fuzz preset, so the lint job skips them.
      - name: Run clang-tidy on the harnesses
        run: ./lint.sh --check --fuzz

      - name: Replay corpus
        run: ./fuzz.sh --no-build --replay

      # New inputs go to a scratch corpus, so the committed corpus stays as it is.
      - name: Fuzz
        run: ./fuzz.sh --no-build --fuzz --seconds 60

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: cpp/fuzz-artifacts
          if-no-files-found: ignore
