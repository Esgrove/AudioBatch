name: C++

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cpp.yml"
      - "assets/**"
      - "common.sh"
      - "cpp/**"
      - "fixtures/**"
      - "!fixtures/normalization/**"
      - "test-plugin/**"
      - "!**/*.md"
  pull_request:
    paths:
      - ".github/workflows/cpp.yml"
      - "assets/**"
      - "common.sh"
      - "cpp/**"
      - "fixtures/**"
      - "!fixtures/normalization/**"
      - "test-plugin/**"
      - "!**/*.md"

# Cancel previous runs for PRs but not pushes to main
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: cpp

jobs:
  build:
    # Release builds compile out the JUCE assertions and turn on the optimizer,
    # so they catch warnings and behaviour that only show up there.
    strategy:
      matrix:
        os: [macos-latest, windows-2025-vs2026]
        build-type: [Debug, Release]
      fail-fast: false
    name: build (${{ matrix.os }}, ${{ matrix.build-type }})
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TYPE: ${{ matrix.build-type }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install ccache
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install ccache

      - name: Get JUCE commit
        id: juce
        run: echo "commit=$(git rev-parse HEAD:cpp/JUCE)" >> "$GITHUB_OUTPUT"

      # The ccache cache lives inside the build directory (build.sh sets CCACHE_DIR),
      # so caching the build directories also caches the compilation cache.
      # The key changes with the build configuration and JUCE, not with every commit,
      # so the cache is saved once per configuration instead of once per commit.
      # The lint and parity jobs restore this cache, and a cache only restores with the same path list it was saved with.
      - name: Cache CMake build directory and ccache
        uses: actions/cache@v6
        with:
          path: |
            cpp/cmake-build-mac-debug
            cpp/cmake-build-mac-release
            cpp/cmake-build-windows-debug
            cpp/cmake-build-windows-release
          key: ${{ runner.os }}-${{ matrix.build-type }}-cmake-${{ steps.juce.outputs.commit }}-${{ hashFiles('cpp/CMakeLists.txt', 'cpp/CMakePresets.json', 'cpp/cmake/*.cmake', 'test-plugin/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-${{ matrix.build-type }}-cmake-

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh --build-type "$BUILD_TYPE"

      - name: Build and run tests
        run: |
          BUILD_TYPE_LOWER=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')
          if [ "$RUNNER_OS" = "macOS" ]; then
            BUILD_DIR="cmake-build-mac-$BUILD_TYPE_LOWER"
          else
            BUILD_DIR="cmake-build-windows-$BUILD_TYPE_LOWER"
          fi
          # Reuse the compilation cache that build.sh keeps inside the build directory.
          export CCACHE_DIR="$PWD/$BUILD_DIR/ccache"
          # build.sh configures without tests, so enable the test target explicitly.
          cmake -S . -B "$BUILD_DIR" -DBUILD_TESTING=ON
          cmake --build "$BUILD_DIR" --target AudioBatchTests --config "$BUILD_TYPE"
          ctest --test-dir "$BUILD_DIR" --build-config "$BUILD_TYPE" --output-on-failure --no-tests=error

      # Runs the CLI that build.sh copied to the C++ project root on the committed test fixtures,
      # and checks the reported level and the exit codes.
      - name: CLI smoke test
        run: |
          CLI=./audiobatch
          if [ "$RUNNER_OS" = "Windows" ]; then
            CLI=./audiobatch.exe
          fi
          "$CLI" --help
          "$CLI" ../fixtures/sine_stereo_44100_16.wav | tee smoke-output.txt
          grep -- "-6.02" smoke-output.txt
          set +e
          "$CLI" ../fixtures/broken.wav
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 2 ]; then
            echo "Expected exit code 2 for a broken file, got $EXIT_CODE"
            exit 1
          fi

      # Reads, lists, caches, and writes a file whose name and folder are outside ASCII,
      # which on Windows depends on the UTF-16 command line and wide file APIs.
      - name: CLI smoke test with non-ASCII paths
        run: |
          CLI="$PWD/audiobatch"
          if [ "$RUNNER_OS" = "Windows" ]; then
            CLI="$PWD/audiobatch.exe"
          fi
          UNICODE_DIR="$RUNNER_TEMP/Ääni ja kuva"
          UNICODE_FILE="$UNICODE_DIR/Łódź テスト.wav"
          mkdir -p "$UNICODE_DIR"
          cp ../fixtures/sine_stereo_44100_16.wav "$UNICODE_FILE"
          "$CLI" --output csv "$UNICODE_FILE" | tee unicode-output.txt
          grep -- "Łódź テスト.wav" unicode-output.txt
          grep -- "-6.02" unicode-output.txt
          "$CLI" --output csv "$UNICODE_DIR" | grep -- "Łódź テスト.wav"
          "$CLI" --normalize "$UNICODE_FILE"
          ls "$UNICODE_DIR"/Łódź\ テスト.aif*

  lint:
    # Use macOS with the latest LLVM from Homebrew, since Ubuntu apt has an older clang-tidy
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Skip the automatic `brew update`, which takes minutes and is not needed for the runner image's formulae.
      # The restored build directory was configured with ccache as the compiler launcher, so ccache must exist.
      - name: Install LLVM, Ninja, and ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install llvm ninja ccache

      - name: Get JUCE commit
        id: juce
        run: echo "commit=$(git rev-parse HEAD:cpp/JUCE)" >> "$GITHUB_OUTPUT"

      # Restores a macOS Debug cache saved by the build job of an earlier run,
      # since this job runs alongside the build job of the same run.
      # It holds the same cmake-build-mac-debug directory, including the fetched dependencies.
      # The path list must match the build job's for the cache to restore.
      # Restore-only, since the build job owns saving it.
      - name: Restore CMake build directory
        uses: actions/cache/restore@v6
        with:
          path: |
            cpp/cmake-build-mac-debug
            cpp/cmake-build-mac-release
            cpp/cmake-build-windows-debug
            cpp/cmake-build-windows-release
          key: ${{ runner.os }}-Debug-cmake-${{ steps.juce.outputs.commit }}-${{ hashFiles('cpp/CMakeLists.txt', 'cpp/CMakePresets.json', 'cpp/cmake/*.cmake', 'test-plugin/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-Debug-cmake-

      # clang-tidy only needs the compile database and the generated JUCE and binary data headers,
      # so the application itself is not built.
      - name: Configure CMake and generate headers
        run: |
          cmake --preset macos-debug
          ninja -C cmake-build-mac-debug \
            AudioBatch_artefacts/JuceLibraryCode/JuceHeader.h \
            AudioBatchCli_artefacts/JuceLibraryCode/JuceHeader.h \
            AudioBatchTests_artefacts/JuceLibraryCode/JuceHeader.h \
            juce_binarydata_Assets/JuceLibraryCode/BinaryData.h

      # Only this step uses the Homebrew LLVM tools,
      # so CMake above still configures with the Xcode toolchain like the build job.
      - name: Run clang-tidy
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          export PATH="$LLVM_PREFIX/bin:$PATH"
          ./lint.sh --check

  sanitize:
    # Runs the unit tests on macOS under AddressSanitizer and UndefinedBehaviorSanitizer,
    # and under ThreadSanitizer, which cannot be combined with AddressSanitizer.
    # On Windows, they run under the MSVC AddressSanitizer.
    strategy:
      matrix:
        include:
          - os: macos-latest
            sanitizer: address
          - os: macos-latest
            sanitizer: thread
          - os: windows-2025-vs2026
            sanitizer: address
      fail-fast: false
    name: sanitize (${{ matrix.os }}, ${{ matrix.sanitizer }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Ninja
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install ninja

      - name: Build and run tests with sanitizers
        run: |
          if [ "${{ matrix.sanitizer }}" = "thread" ]; then
            ./sanitize.sh --thread
          else
            ./sanitize.sh
          fi

  fuzz:
    # Replays the committed corpus through each libFuzzer harness, then fuzzes each one briefly.
    # The macos-fuzz preset uses Homebrew LLVM, since Apple Clang does not ship libFuzzer.
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install LLVM and Ninja
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install llvm ninja

      - name: Build harnesses
        run: |
          cmake --preset macos-fuzz
          cmake --build --preset macos-fuzz

      # The harnesses are only in the compile database of the macos-fuzz preset, so the lint job skips them.
      - name: Run clang-tidy on the harnesses
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          export PATH="$LLVM_PREFIX/bin:$PATH"
          ./lint.sh --check --fuzz

      - name: Replay corpus
        run: ctest --test-dir cmake-build-mac-fuzz --output-on-failure --no-tests=error

      # New inputs go to a scratch corpus, so the committed corpus stays as it is.
      - name: Fuzz
        run: |
          mkdir -p fuzz-artifacts
          for fuzzer in SeratoTagFuzzer CliArgumentsFuzzer; do
            mkdir -p "fuzz-scratch/$fuzzer"
            "cmake-build-mac-fuzz/${fuzzer}_artefacts/RelWithDebInfo/$fuzzer" \
              -max_total_time=60 -artifact_prefix="fuzz-artifacts/$fuzzer-" \
              "fuzz-scratch/$fuzzer" "tests/fuzz/corpus/$fuzzer"
          done

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: cpp/fuzz-artifacts
          if-no-files-found: ignore
