name: C++

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cpp.yml"
      - "assets/**"
      - "common.sh"
      - "cpp/**"
      - "fixtures/**"
      - "!**/*.md"
  pull_request:
    paths:
      - ".github/workflows/cpp.yml"
      - "assets/**"
      - "common.sh"
      - "cpp/**"
      - "fixtures/**"
      - "!**/*.md"

# Cancel previous runs for PRs but not pushes to main
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: cpp

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-2025-vs2026]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install ccache
        if: runner.os == 'macOS'
        run: brew install ccache

      # The ccache cache lives inside the build directory (build.sh sets CCACHE_DIR),
      # so caching the build directories also caches the compilation cache.
      - name: Cache CMake build directory and ccache
        uses: actions/cache@v5
        with:
          path: |
            cpp/cmake-build-mac-debug
            cpp/cmake-build-windows-debug
          key: ${{ runner.os }}-cmake-${{ github.sha }}
          restore-keys: ${{ runner.os }}-cmake-

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh --build-type Debug

      - name: Build and run tests
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            BUILD_DIR=cmake-build-mac-debug
          else
            BUILD_DIR=cmake-build-windows-debug
          fi
          # Reuse the compilation cache that build.sh keeps inside the build directory.
          export CCACHE_DIR="$PWD/$BUILD_DIR/ccache"
          # build.sh configures without tests, so enable the test target explicitly.
          cmake -S . -B "$BUILD_DIR" -DBUILD_TESTING=ON
          cmake --build "$BUILD_DIR" --target AudioBatchTests --config Debug
          ctest --test-dir "$BUILD_DIR" --build-config Debug --output-on-failure

      # Runs the CLI that build.sh copied to the C++ project root on the committed test fixtures,
      # and checks the reported level and the exit codes.
      - name: CLI smoke test
        run: |
          CLI=./audiobatch
          if [ "$RUNNER_OS" = "Windows" ]; then
            CLI=./audiobatch.exe
          fi
          "$CLI" --help
          "$CLI" ../fixtures/sine_stereo_44100_16.wav | tee smoke-output.txt
          grep -- "-6.02" smoke-output.txt
          set +e
          "$CLI" ../fixtures/broken.wav
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 2 ]; then
            echo "Expected exit code 2 for a broken file, got $EXIT_CODE"
            exit 1
          fi

  lint:
    # Use macOS with the latest LLVM from Homebrew, since Ubuntu apt has an older clang-tidy
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Skip the automatic `brew update`, which takes minutes and is not needed for the runner image's formulae.
      - name: Install LLVM and Ninja
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install llvm ninja

      # Restores the build job's macOS cache, which holds the same cmake-build-mac-debug directory
      # including the fetched dependencies.
      # Restore-only, since the build job owns saving it.
      - name: Restore CMake build directory
        uses: actions/cache/restore@v5
        with:
          path: cpp/cmake-build-mac-debug
          key: ${{ runner.os }}-cmake-${{ github.sha }}
          restore-keys: ${{ runner.os }}-cmake-

      # clang-tidy only needs the compile database and the generated JUCE and binary data headers,
      # so the application itself is not built.
      - name: Configure CMake and generate headers
        run: |
          cmake --preset macos-debug
          ninja -C cmake-build-mac-debug \
            AudioBatch_artefacts/JuceLibraryCode/JuceHeader.h \
            AudioBatchCli_artefacts/JuceLibraryCode/JuceHeader.h \
            AudioBatchTests_artefacts/JuceLibraryCode/JuceHeader.h \
            juce_binarydata_Assets/JuceLibraryCode/BinaryData.h

      # Only this step uses the Homebrew LLVM tools,
      # so CMake above still configures with the Xcode toolchain like the build job.
      - name: Run clang-tidy
        run: |
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          ./lint.sh --check

  format:
    # Need to use macOS since Ubuntu apt has an old clang-format version
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # format.sh also checks CMake files with cmake-format, which it runs through uvx,
      # and shell scripts with shfmt.
      - name: Install formatters
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install clang-format shfmt uv

      - name: Check formatting
        run: |
          clang-format --version
          ./format.sh --check

  sanitize:
    # Runs the unit tests under AddressSanitizer and UndefinedBehaviorSanitizer.
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Ninja
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install ninja

      - name: Build and run tests with sanitizers
        run: ./sanitize.sh
