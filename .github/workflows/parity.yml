name: Parity

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/parity.yml"
      - "cpp/**"
      - "fixtures/**"
      - "rust/**"
      - "!**/*.md"
  pull_request:
    paths:
      - ".github/workflows/parity.yml"
      - "cpp/**"
      - "fixtures/**"
      - "rust/**"
      - "!**/*.md"

# Cancel previous runs for PRs but not pushes to main
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Overrides target-cpu=native from rust/.cargo/config.toml,
  # which can cause illegal instruction errors on runners with different CPUs.
  RUSTFLAGS: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  windows-filesystem-normalization:
    # Executes native filesystem, rollback, conflict, metadata, and golden normalization tests.
    # Injected disposers make the fault cases deterministic, they do not certify real recycle-bin behavior.
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Test parity oracles natively
        working-directory: rust
        run: uv run --script scripts/test_parity.py

      - name: Run native filesystem and normalization corpus
        working-directory: rust
        run: |
          for profile in debug release; do
            options=()
            if [ "$profile" = release ]; then options=(--release); fi
            cargo test "${options[@]}" -p audiobatch-core output_file:: -- --nocapture
            cargo test "${options[@]}" -p audiobatch-core atomic_write:: -- --nocapture
            cargo test "${options[@]}" -p audiobatch-core normalize:: -- --nocapture
            cargo test "${options[@]}" -p audiobatch-core normalize_coordinator:: -- --nocapture
            cargo test "${options[@]}" -p audiobatch-core metadata:: -- --nocapture
            cargo test "${options[@]}" -p audiobatch-core golden_tests::test_golden_normalization:: -- --nocapture
            cargo test "${options[@]}" -p audiobatch-cli run::test_run_analysis::normalize_ -- --nocapture
          done

  parity:
    # Runs the C++ and the Rust CLI on the committed fixtures and compares the levels they report,
    # then normalizes the LFS collection with both and compares the output files.
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # The checkout leaves the LFS files as pointers.
      # Caching the objects by their IDs downloads the collection only when it changes, saving LFS bandwidth.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects

      - name: Restore LFS objects
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}

      - name: Pull LFS files
        run: git lfs pull

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Test parity oracles
        working-directory: rust
        run: uv run --script scripts/test_parity.py

      - name: Install Ninja and ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install ninja ccache

      - name: Get JUCE commit
        id: juce
        run: echo "commit=$(git rev-parse HEAD:cpp/JUCE)" >> "$GITHUB_OUTPUT"

      # Restores the macOS Release cache of the C++ workflow's build job.
      # The path list must match the build job's for the cache to restore.
      # Restore-only, since the build job owns saving it.
      - name: Restore C++ build directory
        uses: actions/cache/restore@v6
        with:
          path: |
            cpp/cmake-build-mac-debug
            cpp/cmake-build-mac-release
            cpp/cmake-build-windows-debug
            cpp/cmake-build-windows-release
          key: ${{ runner.os }}-Release-cmake-${{ steps.juce.outputs.commit }}-${{ hashFiles('cpp/CMakeLists.txt', 'cpp/CMakePresets.json', 'cpp/cmake/*.cmake', 'test-plugin/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-Release-cmake-

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Requires every normalization fixture represented by the golden snapshots, not an empty or partial LFS checkout.
      - name: Check exact full normalization corpus
        working-directory: rust
        env:
          AUDIOBATCH_REQUIRE_NORMALIZATION_FIXTURES: "1"
        run: >-
          cargo test --release -p audiobatch-core
          golden_tests::test_golden_files::every_normalization_fixture_when_downloaded
          -- --exact --nocapture

      # Configures with the same arguments as build.sh, so a restored build directory is reused as it is.
      - name: Build C++ CLI
        working-directory: cpp
        run: |
          export CCACHE_DIR="$PWD/cmake-build-mac-release/ccache"
          cmake -S . -B cmake-build-mac-release -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          cmake --build cmake-build-mac-release --target AudioBatchCli

      - name: Compare CLIs
        working-directory: rust
        run: |
          export AUDIOBATCH_CPP_CLI="$PWD/../cpp/cmake-build-mac-release/AudioBatchCli_artefacts/Release/audiobatch"
          ./scripts/parity.sh --release ../fixtures
          ./scripts/parity.sh --release ../fixtures/normalization

      - name: Compare normalized outputs
        working-directory: rust
        run: |
          export AUDIOBATCH_CPP_CLI="$PWD/../cpp/cmake-build-mac-release/AudioBatchCli_artefacts/Release/audiobatch"
          ./scripts/parity.sh --release --normalize --peak 0 ../fixtures/normalization
          ./scripts/parity.sh --release --normalize --peak -1 ../fixtures/normalization
          ./scripts/parity.sh --release --normalize --lufs -14 ../fixtures/normalization
          ./scripts/parity.sh --release --normalize --lufs -23 ../fixtures/normalization
