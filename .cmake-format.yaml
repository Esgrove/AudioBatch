# Config for CMake code formatting
# https://cmake-format.readthedocs.io/en/latest/configuration.html
---
format:
  line_width: 120
  tab_size: 4
  use_tabchars: false
  # Keep calls compact: wrap only when a call does not fit on one line.
  max_subgroups_hwrap: 2
  max_pargs_hwrap: 6
  # Wrap keyword arguments as a nested block instead of aligning them under the keyword.
  max_prefix_chars: 2
  # Put the closing parenthesis of a wrapped call on its own line.
  dangle_parens: true
  dangle_align: prefix
  separate_ctrl_name_with_space: false
  separate_fn_name_with_space: false
  command_case: canonical
  keyword_case: unchanged
parse:
  # Teach the formatter the keyword layout of the JUCE helper commands, so each option stays on one line.
  additional_commands:
    # The built-in set() does not know that FORCE ends a CACHE entry, which makes the call look too complex to inline.
    set:
      pargs: 1+
      flags: [PARENT_SCOPE, FORCE]
      kwargs:
        CACHE: 3
    FetchContent_Declare:
      pargs: 1
      flags: [SYSTEM, EXCLUDE_FROM_ALL]
      kwargs:
        URL: 1
        DOWNLOAD_EXTRACT_TIMESTAMP: 1
        GIT_REPOSITORY: 1
        GIT_TAG: 1
        GIT_SHALLOW: 1
    juce_add_gui_app:
      pargs: 1
      flags: []
      kwargs:
        BUNDLE_ID: 1
        COMPANY_NAME: 1
        COMPANY_WEBSITE: 1
        ICON_BIG: 1
        PRODUCT_NAME: 1
        VERSION: 1
        PLIST_TO_MERGE: 1
    juce_add_console_app:
      pargs: 1
      flags: []
      kwargs:
        COMPANY_NAME: 1
        COMPANY_WEBSITE: 1
        PRODUCT_NAME: 1
        VERSION: 1
        PLUGINHOST_AU: 1
    juce_add_binary_data:
      pargs: 1
      flags: []
      kwargs:
        NAMESPACE: 1
        SOURCES: "*"
markup:
  enable_markup: false
