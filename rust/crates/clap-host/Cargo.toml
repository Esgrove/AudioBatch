[package]
name = "clap-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[features]
default = []
editor = ["plugin-host-core/editor", "dep:raw-window-handle"]

[dependencies]
clack-host.workspace = true
clack-extensions = { workspace = true, features = ["clack-host", "audio-ports", "audio-ports-config", "configurable-audio-ports", "gui", "latency", "params", "render", "state", "tail", "thread-check", "timer"] }
crossbeam-queue.workspace = true
plugin-host-core = { path = "../plugin-host-core" }
raw-window-handle = { workspace = true, optional = true }
thiserror.workspace = true
walkdir.workspace = true
dirs.workspace = true

[dev-dependencies]
audiobatch-test-clap-plugin = { path = "../test-clap-plugin" }
tempfile.workspace = true

[[example]]
name = "clap_host_editor"
path = "examples/editor.rs"
required-features = ["editor"]

[lints]
workspace = true
