[package]
name = "vst3-host"
description = "Safe VST3 plugin hosting: module loading, plugin instances, processing, and editor windows"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Native plugin editor windows, which link AppKit on macOS.
editor = ["dep:raw-window-handle", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
crossbeam-queue.workspace = true
raw-window-handle = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
vst3.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, optional = true }
objc2-core-foundation.workspace = true
objc2-foundation = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
libloading.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
audiobatch-test-plugin.workspace = true
tempfile.workspace = true

[lints]
workspace = true
