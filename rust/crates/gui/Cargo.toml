[package]
name = "audiobatch-gui"
description = "AudioBatchRs desktop app, built on gpui-kit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "AudioBatchRs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
audiobatch-core.workspace = true
audiobatch-playback.workspace = true
audiobatch-plugins = { workspace = true, features = ["editor"] }
crossbeam-channel.workspace = true
gpui-kit.workspace = true
gpui-pre = { workspace = true, optional = true }
gpui-pre-platform = { workspace = true, optional = true }
image.workspace = true
raw-window-handle.workspace = true
serde_json.workspace = true
serde.workspace = true
tracing.workspace = true
trash.workspace = true
vst3-host = { workspace = true, features = ["editor"] }

[dev-dependencies]
audiobatch-test-clap-plugin.workspace = true
audiobatch-test-plugin.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
test-fixtures.workspace = true

# The OLE drag source of `src/file_drag/windows.rs`, which drags files out of the results table.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

# Records the version, build time, and commit for the About dialog and `--version`, see `build.rs`.
[build-dependencies]
build-info.workspace = true

# Embeds the app icon and version information into the Windows executable, see `build.rs`.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[features]
# Saves an image of the window for checking the layout, see `src/snapshot.rs`.
snapshot = ["dep:gpui-pre", "dep:gpui-pre-platform"]

[lints]
workspace = true
