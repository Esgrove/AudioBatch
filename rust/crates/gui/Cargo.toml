[package]
name = "audiobatch-gui"
description = "AudioBatchRs desktop app, built on gpui-kit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "AudioBatchRs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
audiobatch-core.workspace = true
audiobatch-playback.workspace = true
audiobatch-plugins.workspace = true
crossbeam-channel.workspace = true
gpui-kit.workspace = true
gpui-pre = { workspace = true, optional = true }
gpui-pre-platform = { workspace = true, optional = true }
image.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
trash.workspace = true
vst3-host = { workspace = true, features = ["editor"] }

[dev-dependencies]
audiobatch-test-plugin.workspace = true
tempfile.workspace = true

# Records the version, build time, and commit for the About dialog and `--version`, see `build.rs`.
[build-dependencies]
build-info.workspace = true

# Embeds the app icon and version information into the Windows executable, see `build.rs`.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[features]
# Saves an image of the window for checking the layout, see `src/snapshot.rs`.
snapshot = ["dep:gpui-pre", "dep:gpui-pre-platform"]

[lints]
workspace = true
