[package]
name = "audiobatch-fuzz"
description = "cargo-fuzz targets for the AudioBatch parsers and decoders"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# The fuzz targets build only with cargo-fuzz on a nightly toolchain,
# so this crate is its own workspace instead of a member of the main one.
[workspace]

[dependencies]
audiobatch-cli = { path = "../crates/cli" }
audiobatch-core = { path = "../crates/core" }
clap = "4.6.7"
libfuzzer-sys = "0.4.13"
serato-tags = { path = "../crates/serato" }
tempfile = "3.27.0"

[[bin]]
name = "serato_tags"
path = "fuzz_targets/serato_tags.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cli_arguments"
path = "fuzz_targets/cli_arguments.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache_blobs"
path = "fuzz_targets/cache_blobs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_audio"
path = "fuzz_targets/decode_audio.rs"
test = false
doc = false
bench = false

# Regression tests exercise exactly the arithmetic checks used by cargo-fuzz.
[profile.dev]
overflow-checks = true

[profile.release]
debug = 1

# Keep arithmetic findings visible, including those in third-party container readers.
overflow-checks = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
