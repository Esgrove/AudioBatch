[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Esgrove <esgrove@outlook.com>"]
license-file = "../LICENSE"
repository = "https://github.com/Esgrove/AudioBatch"
rust-version = "1.99"

[workspace.dependencies]
audiobatch-core = { path = "crates/core" }
audiobatch-playback = { path = "crates/playback" }
audiobatch-plugins = { path = "crates/plugins" }
audiobatch-test-plugin = { path = "crates/test-plugin" }
serato-tags = { path = "crates/serato" }
test-fixtures = { path = "crates/test-fixtures" }
vst3-host = { path = "crates/vst3-host" }

anyhow = "1.0.104"
async-channel = "2.5.0"
audioadapter-buffers = "5.2.0"
base64 = "0.23.1"
byteorder = "1.5.0"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
colored = "3.1.1"
comfy-table = "8.0.1"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
crossbeam-queue = "0.3.14"
csv = "1.4.0"
ctrlc = "3.5.2"
dirs = "7.0.0"
ebur128 = "0.1.11"
indicatif = "0.18.6"
jiff = "0.2.38"
libloading = "0.8.9"
lofty = "0.25.5"
num_cpus = "1.17.0"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
raw-window-handle = "0.6.2"
rayon = "1.12.0"
rtrb = "0.4.1"
rubato = "5.0.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats"] }
symphonia-common = "0.6.1"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "ansi",
  "fmt",
  "registry",
  "std",
  "tracing-log",
] }
trash = "5.2.9"
unicode-width = "0.2.2"
# The bindings of VST SDK 3.8.0, the SDK JUCE bundles for the C++ application.
# Keep both applications on the same SDK version.
vst3 = "=0.3.0"
walkdir = "2.5.0"
windows-sys = "0.61.2"

[profile.dev]
incremental = true

# Decoding in debug builds is slow enough to make the tests and manual runs tedious.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
# https://rust-lang.github.io/rust-clippy/master/index.html
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

cast_possible_wrap = "deny"
char_lit_as_u8 = "deny"
enum_glob_use = "deny"
exit = "deny"
fn_to_numeric_cast = "deny"
fn_to_numeric_cast_with_truncation = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
ptr_as_ptr = "deny"
string_slice = "deny"
unchecked_time_subtraction = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_cast = "deny"
unwrap_used = "deny"
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
