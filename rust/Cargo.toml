[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Esgrove <esgrove@outlook.com>"]
license-file = "../LICENSE"
repository = "https://github.com/Esgrove/AudioBatch"
rust-version = "1.99"

[workspace.dependencies]
audiobatch-core = { path = "crates/core" }
audiobatch-playback = { path = "crates/playback" }
serato-tags = { path = "crates/serato" }
test-fixtures = { path = "crates/test-fixtures" }

anyhow = "1.0.104"
audioadapter-buffers = "5.2.0"
base64 = "0.23.1"
byteorder = "1.5.0"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
colored = "3.1.1"
comfy-table = "8.0.1"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
csv = "1.4.0"
dirs = "7.0.0"
ebur128 = "0.1.11"
indicatif = "0.18.6"
lofty = "0.25.5"
rayon = "1.12.0"
rtrb = "0.4.1"
rubato = "5.0.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats"] }
symphonia-common = "0.6.1"
tempfile = "3.27.0"
trash = "5.2.9"
walkdir = "2.5.0"

[profile.dev]
incremental = true

# Decoding in debug builds is slow enough to make the tests and manual runs tedious.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
# https://rust-lang.github.io/rust-clippy/master/index.html
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

cast_possible_wrap = "deny"
char_lit_as_u8 = "deny"
enum_glob_use = "deny"
exit = "deny"
fn_to_numeric_cast = "deny"
fn_to_numeric_cast_with_truncation = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
ptr_as_ptr = "deny"
string_slice = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unnecessary_cast = "deny"
unwrap_used = "deny"
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
