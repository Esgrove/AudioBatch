# Configures cargo-about for the crate licenses in the third-party notices of the Rust application and plugin.
# `append_rust_crate_notices` in common.sh reads it.
# Earlier accepted licenses take precedence for crates that offer a choice,
# so permissive licenses with their copyright lines come first.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "Unicode-3.0",
    "NCSA",
    "MPL-2.0",
    "OFL-1.1",
]
# The distributed platforms. Linux-only dependencies never reach a shipped binary.
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
# Build script and test dependencies are not part of the shipped binaries.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The repository's own unpublished crates are covered by its GPL-3.0 LICENSE.
private = { ignore = true }
